changelog:
  exclude:
    labels:
      - Ignore for release
  categories:
    - title: 'Security'
      labels:
        - 'Security'

    - title: 'Major Core & Rule Engine'
      labels:
        - 'Major Core'
        - 'Major Rule Engine'

    - title: 'Major UI'
      labels:
        - 'Major UI'

    - title: 'Major Transport'
      labels:
        - 'Major Transport'

    - title: 'Major Edge'
      labels:
        - 'Major Edge'

    - title: 'Core & Rule Engine'
      labels:
        - 'Core'
        - 'Rule Engine'
      exclude:
        labels:
          - 'Bug'

    - title: 'UI'
      labels:
        - 'UI'
      exclude:
        labels:
          - 'Bug'

    - title: 'Transport'
      labels:
        - 'Transport'
      exclude:
        labels:
          - 'Bug'

    - title: 'Edge'
      labels:
        - 'Edge'
      exclude:
        labels:
          - 'Bug'

    - title: 'Bug: Core & Rule Engine'
      labels:
        - 'Bug'
      exclude:
        labels:
          - 'UI'
          - 'Transport'
          - 'Edge'

    - title: 'Bug: UI'
      labels:
        - 'Bug'
      exclude:
        labels:
          - 'Core'
          - 'Rule Engine'
          - 'Transport'
          - 'Edge'

    - title: 'Bug: Transport'
      labels:
        - 'Bug'
      exclude:
        labels:
          - 'Core'
          - 'Rule Engine'
          - 'UI'
          - 'Edge'

    - title: 'Bug: Edge'
      labels:
        - 'Bug'
      exclude:
        labels:
          - 'Core'
          - 'Rule Engine'
          - 'UI'
          - 'Transport'
