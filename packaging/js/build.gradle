plugins {
    id "com.netflix.nebula.ospackage" version "12.1.1"
}

buildDir = projectBuildDir
version = projectVersion
base {
    distsDirectory = layout.buildDirectory.dir("./")
}

// OS Package plugin configuration
ospackage {
    packageName = pkgName
    version = "${project.version}"
    release = 1
    os = LINUX
    type = BINARY

    into pkgInstallFolder

    user = pkgUser
    permissionGroup = pkgUser

    // Copy the executable file
    from("${buildDir}/package/linux/bin/${pkgName}") {
        filePermissions {
            unix('r-x------')  // 0500
        }
        into "bin"
    }

    // Copy the init file
    from("${buildDir}/package/linux/init/template") {
        filePermissions {
            unix('r-x------')  // 0500
        }
        into "init"
        rename { String filename ->
            "${pkgName}"
        }
    }

    // Copy the config files
    from("${buildDir}/package/linux/conf") {
        fileType CONFIG | NOREPLACE
        filePermissions {
            unix('rwxr-xr--')  // 0754
        }
        into "conf"
    }

    // Copy web files
    from("${buildDir}/web") {
        into "web"
    }

}

// tb-web-report renders reports with the Google Chrome installed on the system
def isWebReport = pkgName == 'tb-web-report'

// Configure our RPM build task
buildRpm {

    arch = X86_64

    archiveVersion = projectVersion.replace('-', '')
    archiveFileName = "${pkgName}.rpm"

    if (isWebReport) {
        requires("google-chrome-stable")
        // Versions with bundled Chromium did not own its directories, so an upgrade leaves them behind empty.
        // %posttrans runs after the old package's files are removed.
        postTrans("if [ -d '${pkgInstallFolder}/chromium' ]; then find '${pkgInstallFolder}/chromium' -depth -type d -empty -delete; fi")
    }

    preInstall file("${buildDir}/control/rpm/preinst")
    postInstall file("${buildDir}/control/rpm/postinst")
    preUninstall file("${buildDir}/control/rpm/prerm")
    postUninstall file("${buildDir}/control/rpm/postrm")

    user = pkgUser
    permissionGroup = pkgUser

    // Copy the system unit files
    from("${buildDir}/control/template.service") {
        addParentDirs = false
        filePermissions {
            unix('rw-r--r--')  // 0644
        }
        into "/usr/lib/systemd/system"
        rename { String filename ->
            "${pkgName}.service"
        }
    }

    link("/etc/${pkgName}/conf", "${pkgInstallFolder}/conf")
}

// Same as the buildRpm task
buildDeb {

    arch = "amd64"

    archiveFileName = "${pkgName}.deb"

    configurationFile("${pkgInstallFolder}/conf/${pkgName}.conf")
    configurationFile("${pkgInstallFolder}/conf/custom-environment-variables.yml")
    configurationFile("${pkgInstallFolder}/conf/default.yml")
    configurationFile("${pkgInstallFolder}/conf/logger.js")

    if (isWebReport) {
        // Pre-Depends, not Depends: dpkg -i unpacks a package before checking its Depends, so an upgrade without Chrome
        // would remove the bundled Chromium and leave the service without a browser. Pre-Depends stops it before unpacking.
        preDepends("google-chrome-stable")
        recommends("fonts-noto-cjk")
        recommends("fonts-noto-color-emoji")
        recommends("fonts-roboto")
        recommends("fonts-liberation")
    }

    preInstall file("${buildDir}/control/deb/preinst")
    postInstall file("${buildDir}/control/deb/postinst")
    preUninstall file("${buildDir}/control/deb/prerm")
    postUninstall file("${buildDir}/control/deb/postrm")

    user = pkgUser
    permissionGroup = pkgUser

    // Copy the system unit files
    from("${buildDir}/control/template.service") {
        addParentDirs = false
        filePermissions {
            unix('rw-r--r--')  // 0644
        }
        into "/lib/systemd/system"
        rename { String filename ->
            "${pkgName}.service"
        }
    }

    link("/etc/${pkgName}/conf", "${pkgInstallFolder}/conf")
}

buildDeb.onlyIf { findProperty('skipDeb') != 'true' }
buildRpm.onlyIf { findProperty('skipRpm') != 'true' }
