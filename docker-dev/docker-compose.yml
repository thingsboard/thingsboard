name: tb-dev

services:
  postgres:
    image: "postgres:18"
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Maven builder. Two modes:
  #   docker compose run --rm builder full   -> one-shot full build of the monorepo
  #   docker compose up builder             -> watch mode (incremental rebuilds)
  # Produces /build/application.jar consumed by tb-init and thingsboard.
  # ---------------------------------------------------------------------------
  builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    working_dir: /src
    environment:
      MAVEN_OPTS: ${MAVEN_OPTS:--Xmx3g}
      WATCH_INTERVAL: ${WATCH_INTERVAL:-2}
    volumes:
      - ../:/src
      - m2-cache:/root/.m2
      - tb-build:/build
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # One-shot schema install + demo data. Skips itself if already installed.
  # ---------------------------------------------------------------------------
  tb-init:
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["/opt/tb/init/install.sh"]
    env_file:
      - ./conf/thingsboard.env
      - path: ./.env
        required: false
    environment:
      INSTALL_TB: "true"
      LOAD_DEMO: ${LOAD_DEMO:-true}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ../:/src:ro
      - tb-build:/build:ro
      - tb-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  thingsboard:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    ports:
      - "8080:8080"   # REST API + WebSocket (ws://localhost:8080/api/ws)
      - "7070:7070"   # Edge RPC
      - "1883:1883"   # MQTT
      - "8883:8883"   # MQTT over TLS
      - "5683-5688:5683-5688/udp" # CoAP / LwM2M
      - "5005:5005"   # remote JVM debug (IntelliJ)
    env_file:
      - ./conf/thingsboard.env
      - path: ./.env
        required: false
    environment:
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JAVA_DEBUG: ${JAVA_DEBUG:-true}
      JAVA_OPTS: ${JAVA_OPTS:--Xms1g -Xmx3g}
    volumes:
      - ../:/src:ro
      - tb-build:/build:ro
      - tb-data:/data
      - ./conf/logback.xml:/opt/tb/logback.xml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    depends_on:
      postgres:
        condition: service_healthy
      tb-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
    name: tb-dev-postgres-data
  m2-cache:
    name: tb-dev-m2-cache
  tb-build:
    name: tb-dev-build
  tb-data:
    name: tb-dev-data
