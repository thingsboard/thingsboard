<svg width="255" height="45" fill="none" version="1.1" viewBox="0 0 255 45" xmlns="http://www.w3.org/2000/svg">
 <rect x=".50664" y=".50664" width="253.99" height="43.987" rx="1.9007" ry="1.9365"
       fill="#ffebee"
       stroke-width="1"
       stroke="#e53935"/>
 <g transform="translate(10,13.53)">
  <text fill="#b71c1c" font-family="Roboto" xml:space="preserve">
   <tspan x="0" y="0" font-size="8px"  dominant-baseline="middle" th:text="${errorMessage}">Failed to load image.</tspan>
   <tspan x="0" th:y="${uriPos}" font-size="8px"  dominant-baseline="middle" th:text="|URI: '${uri}'|">URI.</tspan>
   <tspan th:if="${exception != null}" x="0" y="21" font-size="6px" dominant-baseline="middle" th:text="|Exception details: ${exception}|">Exception.</tspan>
  </text>
 </g>
</svg>
