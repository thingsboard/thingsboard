<table class="tb-report-table">
    <colgroup>
        <col th:each="colKey : ${columns.keySet()}"
             th:attrappend="width=${columns.get(colKey).width != null ? columns.get(colKey).width : null}">
    </colgroup>
    <thead>
    <tr th:if="${showTableHeading}"
        th:style="|height: ${headingHeight};|">
        <th class="tb-report-table-heading"
            th:colspan="${columns.size()}"
            th:style="|text-align: ${headingTextAlignment};
                 vertical-align: ${headingVerticalAlignment};
                 color: ${headingColor};
                 padding: 0;
                 margin: 0;
                 font-size: ${headingFontSize}pt;
                 font-family: ${headingFontFamily};
                 font-style: ${headingFontStyle};
                 font-weight: ${headingFontWeight};|"
            th:utext="${headingText}">Title</th>
    </tr>
    <tr>
        <th th:each="label : ${columns.keySet()}"
            th:style="|display: table-cell;
                 ${columns.get(label).textAlignment != null ? 'text-align:' + columns.get(label).textAlignment + ';' : ''}
                 ${columns.get(label).verticalAlignment != null ? 'vertical-align:' + columns.get(label).verticalAlignment + ';' : ''}
                 ${columns.get(label).color != null ? 'color:' + columns.get(label).color + ';' : ''}
                 ${columns.get(label).backgroundColor != null ? 'background-color:' + columns.get(label).backgroundColor + ';' : ''}
                 ${columns.get(label).fontSize != null ? 'font-size:' + columns.get(label).fontSize + 'pt;' : ''}
                 ${columns.get(label).fontFamily != null ? 'font-family:' + columns.get(label).fontFamily + ';' : ''}
                 ${columns.get(label).fontStyle != null ? 'font-style:' + columns.get(label).fontStyle + ';' : ''}
                 ${columns.get(label).fontWeight != null ? 'font-weight:' + columns.get(label).fontWeight + ';' : ''}|"
            th:text="${label}">Header</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${rows}">
        <td th:each="label : ${columns.keySet()}"
            th:style="|display: table-cell;
                 ${row.get(label).textAlignment != null ? 'text-align:' + row.get(label).textAlignment + ';' : ''}
                 ${row.get(label).verticalAlignment != null ? 'vertical-align:' + row.get(label).verticalAlignment + ';' : ''}
                 ${row.get(label).color != null ? 'color:' + row.get(label).color + ';' : ''}
                 ${row.get(label).backgroundColor != null ? 'background-color:' + row.get(label).backgroundColor + ';' : ''}
                 ${row.get(label).fontSize != null ? 'font-size:' + row.get(label).fontSize + 'pt;' : ''}
                 ${row.get(label).fontFamily != null ? 'font-family:' + row.get(label).fontFamily + ';' : ''}
                 ${row.get(label).fontStyle != null ? 'font-style:' + row.get(label).fontStyle + ';' : ''}
                 ${row.get(label).fontWeight != null ? 'font-weight:' + row.get(label).fontWeight + ';' : ''}|"
            th:utext="${row.get(label).value}">[Value]</td>
    </tr>
    <!-- Empty table fallback row -->
    <tr th:if="${#lists.isEmpty(rows)}">
        <td style="text-align: center;"
            th:colspan="${columns.size()}"
            th:text="${noDataMessage}">Table content is empty</td>
    </tr>
    </tbody>
</table>
