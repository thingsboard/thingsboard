<div class="report-component"
     th:style="|background: ${background};
     border-width: ${borderWidth}pt;
     border-radius: ${borderRadius}pt;
     border-color: ${borderColor};
     border-style: solid;
     margin-left: ${leftMargin}pt;
     margin-top: ${topMargin}pt;
     margin-right: ${rightMargin}pt;
     margin-bottom: ${bottomMargin}pt;
     padding-left: ${leftPadding}pt;
     padding-top: ${topPadding}pt;
     padding-right: ${rightPadding}pt;
     padding-bottom: ${bottomPadding}pt;|"
     th:utext="${htmlContent}">
</div>
