@if (isExternal) {
  <a [href]="link" [target]="target">
    <ng-container *ngTemplateOutlet="logo"></ng-container>
  </a>
} @else {
  <a [routerLink]="link" [target]="target">
    <ng-container *ngTemplateOutlet="logo"></ng-container>
  </a>
}

<ng-template #logo>
  @if (embed) {
    <span [innerHTML]="src | safeSvg | async"></span>
  } @else {
    <img [src]="src" aria-label="logo" alt="Logo"/>
  }
</ng-template>
