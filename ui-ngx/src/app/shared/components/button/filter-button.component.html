<button color="primary"
        matTooltip="{{ buttonDisplayValue() }}"
        matTooltipPosition="above"
        mat-stroked-button
        [disabled]="disabled()"
        (click)="openPanel($event)">
  <mat-icon>filter_list</mat-icon>{{ buttonDisplayValue() }}
</button>
<ng-template #filterPanel>
  <form class="mat-content mat-padding flex flex-col" (ngSubmit)="update()">
    <div class="tb-filter-button-panel-content tb-form-panel no-padding no-border">
      <ng-container *ngTemplateOutlet="panelContent(); context: {$implicit: filterControl}"></ng-container>
    </div>
    <div class="tb-panel-actions flex flex-row items-center justify-end">
      <button type="button"
              mat-button
              color="primary"
              (click)="reset()">
        {{ 'action.reset' | translate }}
      </button>
      <span class="flex-1"></span>
      <button type="button"
              mat-button
              (click)="cancel()">
        {{ 'action.cancel' | translate }}
      </button>
      <button type="submit"
              mat-raised-button
              color="primary"
              [disabled]="filterControl.invalid || !filterControl.dirty">
        {{ 'action.update' | translate }}
      </button>
    </div>
  </form>
</ng-template>
