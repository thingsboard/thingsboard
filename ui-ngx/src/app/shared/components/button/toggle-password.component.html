@if (!hideToggle) {
  <button mat-icon-button type="button" tabindex="-1" (click)="togglePassword($event)" [attr.aria-pressed]="showPassword">
    <mat-icon>{{ showPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
  </button>
}
