<button #widgetButton
        mat-button
        type="button"
        class="tb-widget-button"
        (click)="clicked.emit($event)"
        (mousedown)="mousePressed = true"
        (mouseup)="mousePressed = false"
        (mouseleave)="mousePressed = false"
        [disabled]="disabled"
        [class]="'tb-'+appearance.type"
        [class.tb-icon-only]="appearance.showIcon && !appearance.showLabel"
        [class.tb-pressed]="mousePressed"
        [class.tb-pressed-state]="pressed"
        [class.tb-hover-state]="hovered"
        [class.tb-active-state]="activated"
        [class.tb-disabled-state]="disabled"
        [style.border-radius]="computedBorderRadius"
        [style.pointer-events]="disableEvents ? 'none' : ''">
  @if (appearance.showIcon || appearance.showLabel) {
    <div #widgetButtonContent class="tb-widget-button-content">
      @if (appearance.showIcon) {
        <tb-icon matButtonIcon [style]="iconStyle">{{ appearance.icon }}</tb-icon>
      }
      @if (appearance.showLabel) {
        <span class="tb-widget-button-label">{{ label$ | async }}</span>
      }
    </div>
  }
</button>
