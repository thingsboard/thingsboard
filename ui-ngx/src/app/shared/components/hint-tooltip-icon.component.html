<ng-content class="tb-hint-tooltip-content"></ng-content>
@if (tooltipText) {
  <tb-icon class="tb-hint-tooltip-icon tb-mat-18"
           matTooltip="{{ tooltipText }}"
  [matTooltipPosition]="tooltipPosition">{{ hintIcon }}</tb-icon>
}
