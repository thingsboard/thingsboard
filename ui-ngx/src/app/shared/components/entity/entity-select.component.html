<div [formGroup]="entitySelectFormGroup" class="flex flex-row gap-4 xs:flex-col xs:gap-0">
  <tb-entity-type-select
    *ngIf="displayEntityTypeSelect"
    class="flex-1"
    [label]="entityTypeLabel ?? null"
    [appearance]="appearance"
    [showLabel]="true"
    [required]="required"
    [useAliasEntityTypes]="useAliasEntityTypes"
    [allowedEntityTypes]="allowedEntityTypes"
    [additionEntityTypes]="additionEntityTypes"
    [filterAllowedEntityTypes]="filterAllowedEntityTypes"
    formControlName="entityType">
  </tb-entity-type-select>
  <tb-entity-autocomplete
    #entityAutocompleteComponent
    *ngIf="modelValue.entityType && !entityTypeNullUUID.has(modelValue.entityType)"
    class="flex-1"
    [appearance]="appearance"
    [required]="required && modelValue.entityType !== AliasEntityType.CURRENT_CUSTOMER"
    [entityType]="modelValue.entityType"
    [useEntityDisplayName]="useEntityDisplayName"
    (entityChanged)="changeEntity($event)"
    formControlName="entityId">
  </tb-entity-autocomplete>
</div>
