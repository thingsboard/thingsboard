<div class="tb-color-picker-panel" [class.singleTab]="!useThemePalette">
  @if (useThemePalette) {
    <mat-tab-group
      [selectedIndex]="colorMode === 'color' ? 0 : (colorMode === 'primary' ? 1 : 2)" (selectedIndexChange)="selectedIndexChange($event)">
      <mat-tab label="{{ 'color.color-picker' | translate }}">
        <div class="tb-color-picker-tab">
          <ng-container *ngTemplateOutlet="colorPicker"></ng-container>
        </div>
      </mat-tab>
      <mat-tab label="{{ 'color.primary-colors' | translate }}">
        <tb-theme-color-select
          palette="primary"
          [ngModel]="primaryColor"
          (ngModelChange)="onPrimaryColorChange($event)"
          [ngModelOptions]="{standalone: true}">
        </tb-theme-color-select>
      </mat-tab>
      <mat-tab label="{{ 'color.accent-colors' | translate }}">
        <tb-theme-color-select
          palette="accent"
          [ngModel]="accentColor"
          (ngModelChange)="onAccentColorChange($event)"
          [ngModelOptions]="{standalone: true}">
        </tb-theme-color-select>
      </mat-tab>
    </mat-tab-group>
  } @else {
    <ng-container *ngTemplateOutlet="colorPicker"></ng-container>
  }
  <ng-template #colorPicker>
    <tb-color-picker class="tb-color-picker" [disableAlpha]="disableAlpha" [defaultColor]="defaultColor" [formControl]="plainColorControl"></tb-color-picker>
  </ng-template>
  <div class="tb-color-picker-panel-buttons">
    @if (colorClearButton) {
      <button
        mat-button
        color="primary"
        type="button"
        (click)="clearColor()"
        [disabled]="!getColor()">
        {{ 'action.clear' | translate }}
      </button>
    }
    <span class="flex-1"></span>
    <div class="flex flex-row gap-2">
      @if (colorCancelButton) {
        <button
          mat-button
          type="button"
          (click)="cancelColor()">
          {{ 'action.cancel' | translate }}
        </button>
      }
      <button mat-raised-button
        color="primary"
        type="button"
        (click)="selectColor()"
        [disabled]="!valid || !dirty">
        {{ 'action.select' | translate }}
      </button>
    </div>
  </div>
</div>
