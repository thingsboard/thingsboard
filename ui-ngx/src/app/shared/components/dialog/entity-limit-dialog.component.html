<div class="tb-entity-limit-dialog" style="width: 800px;">
  <mat-toolbar class="tb-dialog-header flex flex-row">
    <h2 translate>subscription-error.title</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="close()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  <mat-progress-bar color="warn" mode="indeterminate" *ngIf="isLoading$ | async">
  </mat-progress-bar>
  <div style="height: 4px;" *ngIf="!(isLoading$ | async)"></div>
  <div mat-dialog-content>
    <div style="text-align: center; padding-top: 20px;">
      <img [src]="limitReachedSvg" style="height: 180px;"/>
    </div>
    <p class="tb-entity-limit-content">{{ errorContent }}<br>{{'subscription.entity-limit-text' | translate}}</p>
    <div class="flex flex-row items-center justify-center">
      <button mat-raised-button color="warn"
              type="button"
              [disabled]="(isLoading$ | async)" (click)="upgrade()">
        <mat-icon>trending_up</mat-icon>
        <span>{{ 'subscription.upgrade-your-plan' | translate }}</span>
      </button>
    </div>
  </div>
  <div mat-dialog-actions class="flex flex-row">
    <span class="flex-1"></span>
    <button mat-button
            type="button"
            [disabled]="(isLoading$ | async)"
            (click)="close()"
            style="margin-right:20px;">
      {{ 'action.close' | translate }}
    </button>
  </div>
</div>
