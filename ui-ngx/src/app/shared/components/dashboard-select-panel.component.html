<div class="mat-content mat-padding flex flex-col">
  <mat-form-field>
    <mat-label>{{'dashboard.select-dashboard' | translate}}</mat-label>
    <mat-select matInput [(ngModel)]="dashboardId"
                (ngModelChange)="dashboardSelected(dashboardId)">
      @for (dashboard of dashboards$ | async; track dashboard) {
        <mat-option [value]="dashboard.id.id">
          {{dashboard.title}}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
