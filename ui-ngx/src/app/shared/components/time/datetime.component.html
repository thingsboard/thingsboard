<mat-form-field [class]="fieldClass"
                [class.tb-datetime-field]="!fieldClass && type === 'datetime'"
                [class.tb-date-field]="!fieldClass && type === 'date'"
                [class.tb-time-field]="!fieldClass && type === 'time'"
                [class.with-clear]="allowClear"
                [subscriptSizing]="subscriptSizing" [appearance]="appearance" [floatLabel]="floatLabel">
  <mat-label *ngIf="showLabel">{{ dateText }}</mat-label>
  <div matSuffix class="mat-mdc-form-field-icon-suffix flex flex-row">
    <button *ngIf="allowClear && date && !disabled"
            type="button"
            mat-icon-button aria-label="Clear"
            (click)="clear($event)">
      <mat-icon>close</mat-icon>
    </button>
    <mat-datetimepicker-toggle [for]="datePicker"></mat-datetimepicker-toggle>
  </div>
  <mat-datetimepicker #datePicker [type]="type" openOnFocus="true"></mat-datetimepicker>
  <input [min]="minDateValue" [max]="maxDateValue"
         [disabled]="disabled"
         [required]="required"
         matInput [(ngModel)]="date"
         [matDatetimepicker]="datePicker" (ngModelChange)="onDateChange()">
</mat-form-field>
