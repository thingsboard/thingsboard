@if (!asBoxInput) {
  <div  class="flex flex-row" [formGroup]="materialIconFormGroup">
    <tb-icon class="icon-value" [style]="color ? { color: color } : {}" (click)="openIconDialog()">{{materialIconFormGroup.get('icon').value}}</tb-icon>
    <mat-form-field class="flex-1" [appearance]="appearance">
      <mat-label>{{ label }}</mat-label>
      <input [required]="required" matInput formControlName="icon" (mousedown)="openIconDialog()">
      @if (iconClearButton) {
        <button
          type="button"
          matSuffix mat-icon-button aria-label="Clear"
          (click)="clear()">
          <tb-icon>close</tb-icon>
        </button>
      }
    </mat-form-field>
  </div>
} @else {
  <button type="button"
          mat-stroked-button
          class="tb-box-button"
          [style.color]="color && !disabled ? color : ''"
          [style.background-color]="backgroundColor && !disabled ? backgroundColor : ''"
          [disabled]="disabled"
          #matButton
          (click)="openIconPopup($event, matButton)">
    <tb-icon matButtonIcon>{{materialIconFormGroup.get('icon').value}}</tb-icon>
  </button>
}
