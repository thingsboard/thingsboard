<div>
  <mat-toolbar color="tb-primary" class="tb-bottom-border flex flex-row" >
    <h2>{{ title | translate }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
      (click)="cancel()"
      type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content class="tb-dark">
    <div
      [innerHTML]="dialogText">
    </div>
  </div>
  <div mat-dialog-actions class="flex justify-end gap-2">
    <button mat-button
      type="button"
      [disabled]="(isLoading$ | async)"
      (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
      type="button"
      [disabled]="(isLoading$ | async)"
      (click)="accept()">
      {{ 'signup.accept' | translate }}
    </button>
  </div>
</div>
