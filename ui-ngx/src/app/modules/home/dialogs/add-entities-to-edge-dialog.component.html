<form [formGroup]="addEntitiesToEdgeFormGroup" (ngSubmit)="assign()">
  <mat-toolbar color="tb-primary" class="tb-bottom-border flex flex-row">
    <h2>{{ assignToEdgeTitle | translate }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content>
    <fieldset [disabled]="isLoading$ | async">
      <span>{{ assignToEdgeText | translate }}</span>
      <tb-entity-list
        formControlName="entityIds"
        required
        appearance="outline"
        [entityType]="entityType"
        [entitySubType]="subType">
      </tb-entity-list>
    </fieldset>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end">
    <button mat-button color="primary"
            style="margin-right: 20px;"
            type="button"
            [disabled]="(isLoading$ | async)"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
            type="submit"
            [disabled]="(isLoading$ | async) || addEntitiesToEdgeFormGroup.invalid
            || !addEntitiesToEdgeFormGroup.dirty">
      {{ 'action.assign' | translate }}
    </button>
  </div>
</form>
