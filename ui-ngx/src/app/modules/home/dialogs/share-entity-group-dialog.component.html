<form (ngSubmit)="share()" style="width: 500px;">
  <mat-toolbar color="tb-primary" class="tb-bottom-border">
    <h2 translate>entity-group.share</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
      (click)="cancel()"
      type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content [formGroup]="shareEntityGroupFormGroup">
    <tb-share-entity-group
      formControlName="shareGroupRequest"
      [isWriteAllowed]="data.isWriteAllowed">
    </tb-share-entity-group>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end">
    <button mat-button color="primary"
      type="button"
      cdkFocusInitial
      [disabled]="(isLoading$ | async)"
      (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
      type="submit"
      [disabled]="(isLoading$ | async) || shareEntityGroupFormGroup.invalid || !shareEntityGroupFormGroup.dirty">
      {{ 'action.share' | translate }}
    </button>
  </div>
</form>
