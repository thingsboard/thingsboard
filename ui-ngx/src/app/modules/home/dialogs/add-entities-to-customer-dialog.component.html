<form [formGroup]="addEntitiesToCustomerFormGroup" (ngSubmit)="assign()">
  <mat-toolbar class="tb-dialog-header">
    <h2>{{ assignToCustomerTitle | translate }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content>
    <fieldset [disabled]="isLoading$ | async">
      <span>{{ assignToCustomerText | translate }}</span>
      <tb-entity-list
        formControlName="entityIds"
        required
        [entityType]="entityType"
        >
      </tb-entity-list>
    </fieldset>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end">
    <button mat-button color="primary"
            type="button"
            [disabled]="(isLoading$ | async)"
            (click)="cancel()" cdkFocusInitial>
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
            type="submit"
            [disabled]="(isLoading$ | async) || addEntitiesToCustomerFormGroup.invalid
            || !addEntitiesToCustomerFormGroup.dirty">
      {{ 'action.assign' | translate }}
    </button>
  </div>
</form>
