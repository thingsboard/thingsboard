<div class="tb-edit-secret-description-panel">
  <div class="tb-edit-secret-description-title">{{ 'secret-storage.edit-description' | translate }}</div>
  <mat-form-field class="mat-block" appearance="outline">
    <mat-label translate>secret-storage.description</mat-label>
    <textarea #input cdkTextareaAutosize matInput [formControl]="descriptionFormControl" rows="2" [maxLength]="255"></textarea>
    <mat-hint align="end">{{input.value?.length || 0}}/255</mat-hint>
  </mat-form-field>
  <div class="tb-edit-secret-description-panel-buttons">
    <button mat-button
            color="primary"
            type="button"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button
            color="primary"
            type="button"
            (click)="applyDescription()"
            [disabled]="descriptionFormControl.invalid || !descriptionFormControl.dirty">
      {{ 'action.save' | translate }}
    </button>
  </div>
</div>
