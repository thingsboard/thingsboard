<div class="flex min-w-0 flex-row items-center justify-start">
  <tb-filter-button emptyLabel="device.device-filter-title"
                    [valueLabel]="deviceInfoFilterLabel"
                    [ngModel]="entitiesTableConfig.componentsData.deviceInfoFilter"
                    (ngModelChange)="deviceInfoFilterChanged($event)">
    <ng-template let-control>
      <tb-device-info-filter [buttonMode]="false" [formControl]="control"></tb-device-info-filter>
    </ng-template>
  </tb-filter-button>
  <mat-slide-toggle
    style="margin-left: 32px;"
    [ngModel]="entitiesTableConfig.componentsData.includeCustomers"
    (ngModelChange)="includeCustomersChanged($event)">
    {{ includeCustomersLabel | translate }}
  </mat-slide-toggle>
</div>
