<div [formGroup]="deviceDataFormGroup" style="padding-bottom: 16px;">
  <mat-accordion multi="true">
    @if (displayDeviceConfiguration) {
      <mat-expansion-panel [expanded]="true">
        <mat-expansion-panel-header>
          <mat-panel-title>
            <div translate>device.device-configuration</div>
          </mat-panel-title>
        </mat-expansion-panel-header>
        <tb-device-configuration
          formControlName="configuration"
          required>
        </tb-device-configuration>
      </mat-expansion-panel>
    }
    @if (displayTransportConfiguration) {
      <mat-expansion-panel [expanded]="true">
        <mat-expansion-panel-header>
          <mat-panel-title>
            <div translate>device.transport-configuration</div>
          </mat-panel-title>
        </mat-expansion-panel-header>
        <tb-device-transport-configuration
          formControlName="transportConfiguration"
          required>
        </tb-device-transport-configuration>
      </mat-expansion-panel>
    }
  </mat-accordion>
</div>
