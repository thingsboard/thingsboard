<div [formGroup]="ruleNodeConfigFormGroup" class="rule-node-config">
  <ng-container #definedConfigContent></ng-container>
  @if (definedDirectiveError) {
    <div class="tb-rulenode-directive-error">{{definedDirectiveError}}</div>
  }
  @if (!useDefinedDirective()) {
    <tb-json-object-edit #jsonObjectEditComponent
                         class="tb-rule-node-configuration-json"
                         formControlName="configuration"
                         [label]="'rulenode.configuration' | translate"
                         [jsonRequired]="required"
                         [fillHeight]="true">
    </tb-json-object-edit>
  }
</div>
