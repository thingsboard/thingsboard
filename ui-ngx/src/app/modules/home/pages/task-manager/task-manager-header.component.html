<div class="flex flex-row items-center gap-4">
  <tb-task-filter-config [ngModel]="taskManagerTableConfig.componentsData.filter"
                         (ngModelChange)="taskManagerChanged($event)">
  </tb-task-filter-config>
  <mat-slide-toggle
    [ngModel]="taskManagerTableConfig.componentsData.includeCustomers"
    (ngModelChange)="includeCustomersChanged($event)">
    {{ includeCustomersLabel | translate }}
  </mat-slide-toggle>
</div>
