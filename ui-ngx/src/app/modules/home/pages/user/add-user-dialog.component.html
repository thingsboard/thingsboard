<form (ngSubmit)="add()" style="min-width: 450px;">
  <mat-toolbar class="tb-dialog-header">
    <h2 translate>user.add</h2>
    <span class="flex-1"></span>
    <div [tb-help]="'users'"></div>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content>
    <tb-user></tb-user>
    <mat-form-field class="mat-block" appearance="outline">
      <mat-label translate>user.activation-method</mat-label>
      <mat-select [ngModelOptions]="{standalone: true}" [(ngModel)]="activationMethod">
        @for (activationMethod of activationMethods; track activationMethod) {
          <mat-option [value]="activationMethod">
            {{ activationMethodTranslations.get(activationMethodEnum[activationMethod]) | translate }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end">
    <button mat-button color="primary"
            type="button"
            cdkFocusInitial
            [disabled]="(isLoading$ | async)"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
            type="submit"
            [disabled]="(isLoading$ | async) || detailsForm.invalid || !detailsForm.dirty">
      {{ 'action.add' | translate }}
    </button>
  </div>
</form>
