<mat-toolbar class="tb-dialog-header">
  <h2 translate>notification.failed-send</h2>
  <span class="flex-1"></span>
  <button mat-icon-button
          (click)="cancel()"
          type="button">
    <mat-icon class="material-icons">close</mat-icon>
  </button>
</mat-toolbar>
<div mat-dialog-content>
  @for (errorStat of errorStatEntries; track errorStat; let isLast = $last) {
    <div>
      <h6>{{ NotificationDeliveryMethodInfoMap.get(errorStat.key).name | translate }}</h6>
      <table class="tb-table-list">
        @for (error of (errorStat.value | keyvalue); track error) {
          <tr>
            <td>
              <mat-chip>{{ error.key }}</mat-chip>
            </td>
            <td class="tb-row-error">{{ error.value }}</td>
          </tr>
        }
      </table>
      @if (!isLast) {
        <mat-divider></mat-divider>
      }
    </div>
  }
</div>
