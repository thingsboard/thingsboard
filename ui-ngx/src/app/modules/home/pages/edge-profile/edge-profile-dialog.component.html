<form (ngSubmit)="save()" style="width: 600px;">
  <mat-toolbar color="tb-primary" class="tb-bottom-border">
    <h2>{{ (isAdd ? 'edge-profile.add' : 'edge-profile.edit' ) | translate }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content>
    <tb-edge-profile
      #edgeProfileComponent
      [standalone]="true"
      [entity]="edgeProfile"
      [isEdit]="true"
      [rootRuleChainControl]="isAdd ? rootRuleChainControl : null">
    </tb-edge-profile>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end">
    <button mat-button color="primary"
            type="button"
            cdkFocusInitial
            [disabled]="(isLoading$ | async)"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
            type="submit"
            [disabled]="(isLoading$ | async) || edgeProfileComponent.entityForm?.invalid || !edgeProfileComponent.entityForm?.dirty
                        || (isAdd && rootRuleChainControl.invalid)">
      {{ (isAdd ? 'action.add' : 'action.save') | translate }}
    </button>
  </div>
</form>
