<tb-filter-button emptyLabel="javascript.javascript-library-filter-title"
                  emptyValue=""
                  [valueLabel]="jsResourceSubTypeLabel"
                  [ngModel]="entitiesTableConfig.componentsData.resourceSubType"
                  (ngModelChange)="jsResourceSubTypeChanged($event)">
  <ng-template let-control>
    <div class="tb-form-row column-xs">
      <div class="fixed-title-width" translate>javascript.script-type</div>
      <mat-form-field class="min-w-0 flex-1" appearance="outline" subscriptSizing="dynamic">
        <mat-select [formControl]="control" [aria-label]="'javascript.script-type' | translate">
          <mat-option value="">{{ 'javascript.all-types' | translate }}</mat-option>
          @for (jsResourceSubType of jsResourceSubTypes; track jsResourceSubType) {
            <mat-option [value]="jsResourceSubType">
              {{ resourceSubTypesTranslationMap.get(jsResourceSubType) | translate }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </ng-template>
</tb-filter-button>
