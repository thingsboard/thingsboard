<button color="primary"
        matTooltip="{{ buttonDisplayValue }}"
        matTooltipPosition="above"
        mat-stroked-button
        [disabled]="disabled"
        (click)="toggleResourceTypeFilterPanel($event)">
  <mat-icon>filter_list</mat-icon>{{ buttonDisplayValue }}
</button>
<ng-template #resourceTypeFilterPanel>
  <form class="mat-content mat-padding flex flex-col" (ngSubmit)="update()">
    <div class="tb-filter-button-panel-content tb-form-panel no-padding no-border" [formGroup]="resourceTypeFilterForm">
      <div class="tb-form-row column-xs">
        <div class="fixed-title-width">{{ typeTitle | translate }}</div>
        <mat-form-field class="flex-1" appearance="outline" subscriptSizing="dynamic">
          <mat-select formControlName="type">
            <mat-option value="">{{ allTypesTitle | translate }}</mat-option>
            @for (type of types; track type) {
              <mat-option [value]="type">
                {{ typeTranslations.get(type) | translate }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    <div class="tb-panel-actions flex flex-row items-center justify-end">
      <button type="button"
              mat-button
              color="primary"
              (click)="reset()">
        {{ 'action.reset' | translate }}
      </button>
      <span class="flex-1"></span>
      <button type="button"
              mat-button
              (click)="cancel()">
        {{ 'action.cancel' | translate }}
      </button>
      <button type="submit"
              mat-raised-button
              color="primary"
              [disabled]="resourceTypeFilterForm.invalid || !resourceTypeFilterForm.dirty">
        {{ 'action.update' | translate }}
      </button>
    </div>
  </form>
</ng-template>
