<tb-filter-button emptyLabel="resource.resource-filter-title"
                  emptyValue=""
                  [valueLabel]="resourceTypeLabel"
                  [ngModel]="entitiesTableConfig.componentsData.resourceType"
                  (ngModelChange)="resourceTypeChanged($event)">
  <ng-template let-control>
    <div class="tb-form-row column-xs">
      <div class="fixed-title-width" translate>resource.resource-type</div>
      <mat-form-field class="flex-1" appearance="outline" subscriptSizing="dynamic">
        <mat-select [formControl]="control">
          <mat-option value="">{{ 'resource.all-types' | translate }}</mat-option>
          @for (resourceType of resourceTypes; track resourceType) {
            <mat-option [value]="resourceType">
              {{ resourceTypesTranslationMap.get(resourceType) | translate }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </ng-template>
</tb-filter-button>
