<form (ngSubmit)="save()" style="width: 850px;max-height: 100vh">
  <mat-toolbar class="tb-dialog-header">
    <h2>{{ 'admin.oauth2.add-client' | translate }}</h2>
    <span class="flex-1"></span>
    <div [tb-help]="helpLinkId()"></div>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content style="padding: 0">
    <tb-client createNewDialog #clientComponent></tb-client>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end">
    <button mat-button color="primary"
            type="button"
            cdkFocusInitial
            [disabled]="(isLoading$ | async)"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
            type="submit"
            [disabled]="(isLoading$ | async) || clientComponent.entityForm?.invalid || !clientComponent.entityForm?.dirty">
      {{ 'action.add' | translate }}
    </button>
  </div>
</form>
