<div class="flex flex-row items-center justify-start">
  <tb-entity-subtype-filter [entityType]="entityType.ENTITY_VIEW"
                            [ngModel]="entitiesTableConfig.componentsData.entityViewType"
                            (ngModelChange)="entityViewTypeChanged($event)">
  </tb-entity-subtype-filter>
  <mat-slide-toggle
    style="margin-left: 32px;"
    [ngModel]="entitiesTableConfig.componentsData.includeCustomers"
    (ngModelChange)="includeCustomersChanged($event)">
    {{ includeCustomersLabel | translate }}
  </mat-slide-toggle>
</div>
