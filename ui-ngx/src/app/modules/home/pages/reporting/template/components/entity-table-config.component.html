<div class="tb-form-panel no-border h-full" [formGroup]="reportConfigForm">
  @if (!isPlainFormat) {
    <div class="tb-report-component-config-header">
      <tb-toggle-select [(ngModel)]="settingsTab" [ngModelOptions]="{standalone: true}" appearance="fill">
        <tb-toggle-option value="data">{{ 'report-template.data' | translate }}</tb-toggle-option>
        <tb-toggle-option value="layout">{{ 'report-template.layout' | translate }}</tb-toggle-option>
      </tb-toggle-select>
    </div>
  }
  <div class="tb-form-panel no-border no-padding overflow-y-auto" [class.!hidden]="settingsTab !== 'data'">
    <tb-datasources
      [configMode]="basicMode"
      stroked
      displayDatasourceFilterForBasicMode
      hideDataKeys
      formControlName="dataSources"
      [dataSourcesOptions]="{
                    widgetType: widgetType.latest,
                    maxDatasources: 1,
                    datasourcesOptional: false,
                    allowFunctions: false
      }"
      [callbacks]="callbacks"
      [aliasController]="context.aliasController">
    </tb-datasources>
    <div class="tb-form-panel stroked tb-slide-toggle">
      <mat-expansion-panel class="tb-settings" [expanded]="reportConfigForm.get('showTableHeading').value" disabled>
        <mat-expansion-panel-header class="flex flex-row flex-wrap">
          <mat-panel-title>
            <mat-slide-toggle class="mat-slide flex items-stretch justify-center" formControlName="showTableHeading" (click)="$event.stopPropagation()">
              {{ 'report-template.component.table.table-heading' | translate }}
            </mat-slide-toggle>
          </mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
          <tb-report-heading [variableNames]="['entityName', 'entityLabel', 'rowCount']"
                             [withLayout]="!isPlainFormat"
                             formControlName="tableHeading"></tb-report-heading>
        </ng-template>
      </mat-expansion-panel>
    </div>
    <tb-data-keys-panel
      [dataKeysPanelOptions]="{
        widgetType: widgetType.latest,
        callbacks: callbacks,
        settingsFormFunction: !isPlainFormat ? dataKeySettingsFormFunction : null,
        settingsFormTrimDefaults: true
      }"
      reportMode
      stroked
      panelTitle="{{ 'widgets.table.columns' | translate }}"
      addKeyTitle="{{ 'widgets.table.add-column' | translate }}"
      keySettingsTitle="{{ 'widgets.table.column-settings' | translate }}"
      removeKeyTitle="{{ 'widgets.table.remove-column' | translate }}"
      noKeysText="{{ 'widgets.table.no-columns' | translate }}"
      hideDataKeyColor
      [datasourceType]="datasource?.type"
      [deviceId]="datasource?.deviceId"
      [entityAliasId]="datasource?.entityAliasId"
      [aliasController]="context.aliasController"
      formControlName="columns">
      <tb-table-sort-order formControlName="tableSortOrder" [columns]="columnLabels" [columnNameChange]="columnNameChanged"></tb-table-sort-order>
    </tb-data-keys-panel>
  </div>
  @if (!isPlainFormat) {
    <tb-report-component-layout-settings class="overflow-y-auto" [class.!hidden]="settingsTab !== 'layout'" formControlName="layout">
    </tb-report-component-layout-settings>
  }
</div>
