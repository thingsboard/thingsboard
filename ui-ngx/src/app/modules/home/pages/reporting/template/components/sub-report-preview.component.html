<div class="tb-sub-report-preview">
  <div class="tb-type-title mat-elevation-z2">
    <tb-icon class="tb-mat-20">mdi:chart-box-outline</tb-icon>
    <div translate>report-template.component.sub-report.type</div>
  </div>
  @if(subReport$ | async; as subReport) {
    <div class="flex flex-row items-center gap-3">
      <div>{{ subReport.name }}</div>
      <button type="button"
              matTooltip="{{'report-template.open-subreport-new-tab' | translate }}"
              matTooltipPosition="above"
              matSuffix mat-icon-button aria-label="Details"
              (click)="openSubReportNewTab($event, subReport)">
        <tb-icon matButtonIcon>open_in_new</tb-icon>
      </button>
    </div>
  } @else {
    {{ 'report-template.component.sub-report.no-sub-report' | translate }}
  }
</div>
