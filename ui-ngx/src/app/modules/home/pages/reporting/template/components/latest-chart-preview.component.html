<div class="tb-latest-chart-preview" [style.justify-content]="imageAlign">
  @if (hasData) {
    <div class="flex flex-col gap-2" [style.width]="imageWidth" [style.min-width]="imageWidth"
         [style.height.px]="imageHeightPx">
      @if (showTitle) {
        <div style="display: table-cell; padding: 1px 1px 0;" [style]="titleStyle" [innerHTML]="title | safe: 'html'">
        </div>
      }
      <div class="tb-latest-chart flex-1">
        <ng-container #widgetContent></ng-container>
      </div>
    </div>
  } @else {
    <div class="tb-latest-chart-text" [style.width]="imageWidth" [style.height.px]="imageHeightPx">
      {{ noDataMessage | translate: {chartType: chartTypeTitle} }}
    </div>
  }
</div>
