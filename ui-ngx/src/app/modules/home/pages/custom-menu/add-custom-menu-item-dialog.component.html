<form (ngSubmit)="submit()" style="min-width: 600px;">
  <mat-toolbar color="tb-primary" class="tb-bottom-border">
    <h2>{{ title | translate }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
      (click)="cancel()"
      type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  }
  @if ((isLoading$ | async) === false) {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content class="flex flex-col">
    <tb-custom-menu-item
      [scope]="data.scope"
      [menuItemTypeEditable]="!data.subItem"
      [formControl]="customMenuItemControl">
    </tb-custom-menu-item>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end">
    <button mat-button color="primary"
      type="button"
      [disabled]="(isLoading$ | async)"
      (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
      type="submit"
      [disabled]="(isLoading$ | async) || customMenuItemControl.invalid || !customMenuItemControl.dirty">
      {{ 'action.add' | translate }}
    </button>
  </div>
</form>
