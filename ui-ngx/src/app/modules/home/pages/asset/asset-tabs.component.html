@if (entity) {
  <mat-tab label="{{ 'attribute.attributes' | translate }}" #attributesTab="matTab">
    <tb-attribute-table [defaultAttributeScope]="attributeScopes.SERVER_SCOPE"
                        [active]="attributesTab.isActive"
                        [entityId]="entity.id"
                        [entityName]="entity.name">
    </tb-attribute-table>
  </mat-tab>
  <mat-tab label="{{ 'attribute.latest-telemetry' | translate }}" #telemetryTab="matTab">
    <tb-attribute-table [defaultAttributeScope]="latestTelemetryTypes.LATEST_TELEMETRY"
                        disableAttributeScopeSelection
                        [active]="telemetryTab.isActive"
                        [entityId]="entity.id"
                        [entityName]="entity.name">
    </tb-attribute-table>
  </mat-tab>
  @if (authUser.authority === authorities.TENANT_ADMIN) {
    <mat-tab label="{{ 'entity.type-calculated-fields' | translate }}" #calculatedFieldsTab="matTab">
      <tb-calculated-fields-table [active]="calculatedFieldsTab.isActive" [entityId]="entity.id" [ownerId]="ownerId"/>
    </mat-tab>
    <mat-tab #alarmRules="matTab"
             label="{{'alarm-rule.alarm-rules' | translate }}">
      <tb-alarm-rules-table [active]="alarmRules.isActive" [entityId]="entity.id" [entityName]="entity.name" [ownerId]="ownerId"></tb-alarm-rules-table>
    </mat-tab>
  }
  <mat-tab label="{{ 'alarm.alarms' | translate }}" #alarmsTab="matTab">
    <tb-alarm-table [active]="alarmsTab.isActive" [entityId]="entity.id"></tb-alarm-table>
  </mat-tab>
  <mat-tab label="{{ 'asset.events' | translate }}" #eventsTab="matTab">
    <tb-event-table [defaultEventType]="eventTypes.ERROR" [active]="eventsTab.isActive" [tenantId]="entity.tenantId.id"
                    [entityId]="entity.id"></tb-event-table>
  </mat-tab>
  <mat-tab label="{{ 'relation.relations' | translate }}" #relationsTab="matTab">
    <tb-relation-table [active]="relationsTab.isActive" [entityId]="entity.id"></tb-relation-table>
  </mat-tab>
  @if (authUser.authority === authorities.TENANT_ADMIN) {
    <mat-tab label="{{ 'audit-log.audit-logs' | translate }}" #auditLogsTab="matTab">
      <tb-audit-log-table detailsMode="true" [active]="auditLogsTab.isActive" [auditLogMode]="auditLogModes.ENTITY" [entityId]="entity.id"></tb-audit-log-table>
    </mat-tab>
    <mat-tab label="{{ 'version-control.version-control' | translate }}" #versionControlTab="matTab">
      <tb-version-control detailsMode="true" singleEntityMode="true"
                          (versionRestored)="entitiesTableConfig.updateData()"
                          [active]="versionControlTab.isActive" [entityId]="entity.id"
                          [entityName]="entity.name"
                          [externalEntityId]="entity.externalId || entity.id">
      </tb-version-control>
    </mat-tab>
  }
}
