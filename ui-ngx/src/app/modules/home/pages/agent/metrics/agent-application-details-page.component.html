<mat-drawer-container hasBackdrop="false" class="tb-app-details-page tb-absolute-fill">
  <mat-drawer class="tb-app-details-page-drawer mat-elevation-z4"
    mode="over"
    position="end"
    [opened]="chartsOpen"
    (closedStart)="chartsOpen = false">
    @if (appEntityId && chartsOpen) {
      <tb-agent-multi-entity-metrics-panel
        [entities]="entities"
        title="Application metrics (stacked units)"
        [closeable]="true"
        (closePanel)="closeCharts()">
      </tb-agent-multi-entity-metrics-panel>
    }
  </mat-drawer>
  <mat-drawer-content class="tb-app-details-page-content">
    @if (appEntityId) {
      <section class="tb-app-details-page-strip">
        <tb-agent-metrics-strip [snapshot]="snapshot"
          [showChartsButton]="true"
          [chartsActive]="chartsOpen"
          (toggleCharts)="toggleCharts()">
        </tb-agent-metrics-strip>
      </section>
    }
    <tb-entity-details-page class="tb-app-details-page-body"></tb-entity-details-page>
  </mat-drawer-content>
</mat-drawer-container>
