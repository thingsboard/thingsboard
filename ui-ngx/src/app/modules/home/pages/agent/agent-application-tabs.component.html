@if (entity) {
  <mat-tab
    label="{{ 'agent.app-units' | translate }}" #unitsTab="matTab">
    <tb-agent-app-unit-table [application]="entity" [active]="unitsTab.isActive"></tb-agent-app-unit-table>
  </mat-tab>
}

@if (entity) {
  <mat-tab
    label="{{ 'agent.app-events' | translate }}" #eventsTab="matTab">
    <tb-agent-app-event-table [application]="entity" [active]="eventsTab.isActive"></tb-agent-app-event-table>
  </mat-tab>
}

@if (entity) {
  <mat-tab
    label="{{ 'attribute.attributes' | translate }}" #attributesTab="matTab">
    <tb-attribute-table [defaultAttributeScope]="attributeScopes.SERVER_SCOPE"
      [active]="attributesTab.isActive"
      [entityId]="entity.id"
      [entityName]="entity.name">
    </tb-attribute-table>
  </mat-tab>
}

@if (entity) {
  <mat-tab
    label="{{ 'attribute.latest-telemetry' | translate }}" #telemetryTab="matTab">
    <tb-attribute-table [defaultAttributeScope]="latestTelemetryTypes.LATEST_TELEMETRY"
      disableAttributeScopeSelection
      [active]="telemetryTab.isActive"
      [entityId]="entity.id"
      [entityName]="entity.name">
    </tb-attribute-table>
  </mat-tab>
}
