@if (dashboard) {
  <tb-dashboard-page [embedded]="true" [dashboard]="dashboard" [hideToolbar]="dashboard.hideDashboardToolbar"></tb-dashboard-page>
} @else {
  @if (!loading) {
    <iframe frameborder="0" height="100%" width="100%" [src]="iframeUrl | safe: 'resourceUrl' "></iframe>
  }
}
