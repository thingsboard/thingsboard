<form style="width: 800px;">
  <mat-toolbar class="tb-dialog-header">
    <h2 translate>widget.select-widget-type</h2>
    <span class="flex-1"></span>
    <div tb-help="widgetTypes"></div>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content>
    <fieldset [disabled]="(isLoading$ | async)">
      <div class="flex flex-col items-center justify-center gap-4 gt-sm:flex-row">
        @for (type of allWidgetTypes; track type) {
          <button class="tb-card-button" mat-raised-button color="primary"
                  type="button"
                  (click)="typeSelected(widgetTypes[type])">
            <tb-icon matButtonIcon class="tb-mat-96">
              {{ widgetTypesDataMap.get(widgetTypes[type]).icon }}
            </tb-icon>
            <span translate>{{ widgetTypesDataMap.get(widgetTypes[type]).name }}</span>
          </button>
        }
      </div>
    </fieldset>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end">
    <button mat-button color="primary"
            type="button"
            [disabled]="(isLoading$ | async)"
            (click)="cancel()" cdkFocusInitial>
      {{ 'action.cancel' | translate }}
    </button>
  </div>
</form>
