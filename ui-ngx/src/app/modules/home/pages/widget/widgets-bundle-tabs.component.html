@if (isTenantWidgetsBundle() && ([resource.VERSION_CONTROL, resource.WIDGETS_BUNDLE] | hasGenericPermission: operation.READ)) {
  <mat-tab
    label="{{ 'version-control.version-control' | translate }}" #versionControlTab="matTab">
    <tb-version-control detailsMode="true" singleEntityMode="true"
                        (versionRestored)="entitiesTableConfig.updateData()"
                        [active]="versionControlTab.isActive"
                        [entityId]="entity.id"
                        [entityName]="entity.title"
                        [externalEntityId]="entity.externalId || entity.id"></tb-version-control>
  </mat-tab>
}
