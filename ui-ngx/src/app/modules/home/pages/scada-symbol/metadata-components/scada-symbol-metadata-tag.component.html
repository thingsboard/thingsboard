<div [formGroup]="tagFormGroup" class="tb-form-table-row tb-scada-symbol-metadata-tag-row">
  <div class="tb-tag-field">
    <mat-chip-set>
      <mat-chip>
        <span class="tb-scada-symbol-metadata-tag-label">
          {{ tagFormGroup.get('tag').value }}
        </span>
      </mat-chip>
    </mat-chip-set>
  </div>
  <div class="tb-state-render-function-field">
    @if (!disabled || tagFormGroup.get('stateRenderFunction').value) {
      <button
        #editStateRenderFunctionButton
        mat-button
        color="primary"
        (click)="editTagStateRenderFunction()">
        <mat-icon>{{ disabled ? 'visibility' :  (tagFormGroup.get('stateRenderFunction').value ? 'edit' : 'add') }}</mat-icon>
        <span>{{ ( disabled ? 'action.view' : (tagFormGroup.get('stateRenderFunction').value ? 'action.edit' : 'action.add') ) | translate }}</span>
      </button>
    }
  </div>
  @for (trigger of actionTriggers; track trigger) {
    <div class="tb-action-function-field">
      @if (!disabled || tagFormGroup.get(actionControlName(trigger)).value) {
        <button
          #editActionButton
          [attr.data-trigger]="trigger"
          mat-button
          color="primary"
          (click)="editAction(trigger)">
          <mat-icon>{{ disabled ? 'visibility' : (tagFormGroup.get(actionControlName(trigger)).value ? 'edit' : 'add') }}</mat-icon>
          <span>{{ ( disabled ? 'action.view' : (tagFormGroup.get(actionControlName(trigger)).value ? 'action.edit' : 'action.add') ) | translate }}</span>
        </button>
      }
    </div>
  }
</div>
