<ul class="tb-side-menu flex flex-col items-stretch justify-start">
  @for (section of menuSections$ | async; track section.id) {
    <li>
      @switch (section.type) {
        @case ('link') {
          <tb-menu-link [section]="section" [collapsed]="collapsed"></tb-menu-link>
        }
        @case ('toggle') {
          <tb-menu-toggle [section]="section" [collapsed]="collapsed"></tb-menu-toggle>
        }
      }
    </li>
  }
</ul>
