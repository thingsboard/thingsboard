@if (showAiAssistant() || show()) {
  <div class="flex flex-row items-center justify-end gap-2" style="height: 100%; padding: 0 16px 2px;">
    @if (showAiAssistant()) {
      <button class="lt-md:!hidden" mat-flat-button color="primary" (click)="toggleAiAssistant($event)">
        <tb-icon matButtonIcon>mdi:creation</tb-icon>
        {{ "ai-assistant.configure-with-ai" | translate }}
      </button>
      <button class="gt-sm:!hidden" mat-mini-fab color="primary" (click)="toggleAiAssistant($event)"
              matTooltip="{{ 'ai-assistant.configure-with-ai' | translate }}"
              matTooltipPosition="above">
        <tb-icon>mdi:creation</tb-icon>
      </button>
    }
    @if (show()) {
      <button class="lt-md:!hidden" mat-flat-button color="primary" (click)="sendNotification($event)">
        <mat-icon>send</mat-icon>
        <span translate>notification.send-notification</span>
      </button>
      <button class="mat-elevation-z0 gt-sm:!hidden" mat-mini-fab color="primary" (click)="sendNotification($event)">
        <mat-icon>send</mat-icon>
      </button>
    }
  </div>
}
