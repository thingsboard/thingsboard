<button mat-icon-button #showNotificationButton (click)="showNotification($event, showNotificationButton)">
  <tb-icon aria-hidden="false" [matBadge]="(count$ | async)" [matBadgeHidden]="!(count$ | async)" matBadgeColor="warn" matBadgeSize="small">
    {{ (wl.isPrimaryColorPanels$() | async) ? 'notifications' : 'notifications_none' }}
  </tb-icon>
</button>
