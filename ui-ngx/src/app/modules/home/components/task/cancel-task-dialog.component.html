<h2 mat-dialog-title tbTruncateWithTooltip>{{data.title}}</h2>
<div mat-dialog-content [innerHTML]="data.message | safe: 'html'"></div>
<div mat-dialog-actions class="flex items-center justify-end">
  <button mat-button color="primary" [mat-dialog-close]="false">{{ 'action.no' | translate }}</button>
  <button mat-raised-button color="accent" [mat-dialog-close]="true" cdkFocusInitial>{{ 'task.cancel-anyway' | translate }}</button>
</div>
