<section class="tb-agg-latest-mapping-table flex flex-col">
  <label translate class="tb-title no-padding">rule-node-config.mappings</label>
  <div class="body">
    @for (aggMapping of mappings; track aggMapping) {
      <div class="row mat-elevation-z1 flex flex-1 flex-row items-center justify-start">
        <span class="cell tb-agg-mapping-display-value flex-1">{{ mappingDisplayValue(aggMapping)}}</span>
        <button [class.!hidden]="disabled"
          [disabled]="isLoading$ | async"
          mat-icon-button color="primary" type="button"
          (click)="editAggMapping($event, aggMapping)"
          matTooltip="{{'rule-node-config.edit-mapping' | translate}}"
          matTooltipPosition="above">
          <mat-icon>edit</mat-icon>
        </button>
        <button [class.!hidden]="disabled"
          [disabled]="isLoading$ | async"
          mat-icon-button color="primary" type="button"
          (click)="removeAggMapping($index)"
          matTooltip="{{'rule-node-config.remove-mapping' | translate}}"
          matTooltipPosition="above">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    }
  </div>
  <span [class.!hidden]="mappings.length"
    [class.disabled]="disabled"
    [class.required]="required"
  class="no-data-found flex items-center justify-center" translate>rule-node-config.add-mapping-prompt</span>
  <div style="padding-top: 20px;">
    <button [class.!hidden]="disabled" [disabled]="isLoading$ | async" type="button"
      mat-raised-button color="primary" (click)="addAggMapping($event)"
      matTooltip="{{ 'rule-node-config.add-mapping' | translate }}"
      matTooltipPosition="above">
      <mat-icon>add</mat-icon>
      {{ 'action.add' | translate }}
    </button>
  </div>
</section>
