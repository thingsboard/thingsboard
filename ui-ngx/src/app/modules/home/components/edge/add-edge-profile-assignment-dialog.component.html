<form [formGroup]="formGroup" (ngSubmit)="add()" style="min-width: 600px;">
  <mat-toolbar color="tb-primary" class="tb-bottom-border flex flex-row">
    <h2>{{ section.addLabel | translate }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button (click)="cancel()" type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate"></mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content>
    <fieldset [disabled]="isLoading$ | async" class="flex flex-col">
      <span style="padding-bottom: 10px;">{{ 'edge-profile.add-assignment-text' | translate }}</span>
      @if (isGroup) {
        <tb-owner-autocomplete
          required
          appearance="outline"
          placeholderText="edge-profile.owner"
          formControlName="ownerId">
        </tb-owner-autocomplete>
        <tb-edge-entity-group-list
          required
          [groupType]="section.groupType"
          [ownerId]="ownerId"
          [excludeGroupAll]="true"
          [ownerGroupsOnly]="true"
          formControlName="ids">
        </tb-edge-entity-group-list>
      } @else {
        <tb-entity-list
          formControlName="ids"
          required
          appearance="outline"
          [entityType]="section.entityType"
          [entitySubType]="subType">
        </tb-entity-list>
      }
    </fieldset>
  </div>
  <div mat-dialog-actions class="flex flex-row items-center justify-end">
    <button mat-button color="primary" type="button" [disabled]="(isLoading$ | async)" (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary" type="submit"
            [disabled]="(isLoading$ | async) || formGroup.invalid || !formGroup.dirty">
      {{ 'action.add' | translate }}
    </button>
  </div>
</form>
