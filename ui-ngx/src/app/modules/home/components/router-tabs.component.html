<div class="flex flex-1 flex-col" [class.mt-2]="(homeService.hideMainToolbar$ | async) === false" style="width: 100%;">
  <div class="flex flex-row" style="width: 100%;">
    @if (!routerOutlet?.activatedRouteData?.hideTabs && !hideCurrentTabs && (tabs$ | async).length > 1) {
      <nav mat-tab-nav-bar mat-stretch-tabs="false" class="tb-router-tabs flex-1" [tabPanel]="tabPanel">
        @for (tab of tabs$ | async; track tab) {
          <a
            routerLink="{{tab.path}}"
            replaceUrl="{{ replaceUrl }}"
            routerLinkActive
            #rla="routerLinkActive"
            mat-tab-link
            [active]="rla.isActive">
            @if (tab.icon !== null) {
              <tb-icon class="tb-mat-18">{{tab.icon}}</tb-icon>
            }
            <span>{{tab.name | translate}}</span>
          </a>
        }
      </nav>
    }
    <tb-anchor #tabsHeaderComponent></tb-anchor>
  </div>
  <mat-tab-nav-panel #tabPanel class="tb-router-tabs-content flex flex-1 flex-col">
    <router-outlet #routerOutlet="outlet" (activate)="activeComponentChanged($event)"></router-outlet>
  </mat-tab-nav-panel>
</div>
