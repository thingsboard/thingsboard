@for (subEntity of subEntities; track subEntity) {
  <a class="tb-entity-chip"
     routerLink="{{entityDetailsPrefixUrl}}/{{subEntity.id.id}}" (click)="$event.stopPropagation();">
    {{ subEntity.name | customTranslate }}
  </a>
}
