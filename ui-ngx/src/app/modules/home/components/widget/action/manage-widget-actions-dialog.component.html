<form [formGroup]="actionsSettings" style="width: 900px;">
  <mat-toolbar color="tb-primary" class="tb-bottom-border">
    <h2>{{ data.widgetTitle }}: {{ 'widget-config.actions' | translate }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content style="position: relative; height: 500px;">
    <tb-manage-widget-actions
      [callbacks]="data.callbacks"
      [actionTypes]="widgetActionTypesList"
      [customFunctionArgs]="['$event', 'widgetContext', 'entityId', 'entityName', 'additionalParams', 'entityLabel']"
      [widgetType] = "data.widgetType"
      [widgetName]="data.widgetName"
      [widgetTitle]="data.widgetTitle"
      [actionSources]="actionSources"
      [defaultIconColor]="data.defaultIconColor"
      [additionalWidgetActionTypes]="data.additionalWidgetActionTypes"
      formControlName="actions">
    </tb-manage-widget-actions>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end">
    <button mat-button color="primary"
            type="button"
            [disabled]="(isLoading$ | async)"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
            (click)="save()"
            [disabled]="(isLoading$ | async) || actionsSettings.invalid || !actionsSettings.dirty">
      {{ 'action.save' | translate }}
    </button>
  </div>
</form>
