<section class="tb-widget-settings" [formGroup]="providerSettingsFormGroup">
  <mat-form-field class="mat-block">
    <mat-label translate>widgets.maps.google-maps-api-key</mat-label>
    <input matInput formControlName="gmApiKey">
    @if (!providerSettingsFormGroup.get('gmApiKey').value) {
      <mat-icon matSuffix
                class="tb-warning"
                tabindex="0"
                role="img"
                aria-hidden="false"
                [attr.aria-label]="'widgets.maps.layer.credentials.api-key-missing' | translate"
                matTooltipPosition="above"
                matTooltipClass="tb-warning-tooltip"
                matTooltip="{{ 'widgets.maps.layer.credentials.api-key-missing' | translate }}">
        warning
      </mat-icon>
    }
  </mat-form-field>
  <mat-form-field class="mat-block">
    <mat-label translate>widgets.maps.default-map-type</mat-label>
    <mat-select required formControlName="gmDefaultMapType">
      @for (type of googleMapTypes; track type) {
        <mat-option [value]="type">
          {{googleMapTypeTranslations.get(type) | translate}}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</section>
