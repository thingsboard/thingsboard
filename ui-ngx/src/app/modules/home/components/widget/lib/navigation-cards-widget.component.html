@if (cols) {
  <mat-grid-list class="tb-navigation-cards" [cols]="cols" rowHeight="280px">
    @for (section of showHomeSections$| async; track section) {
      <mat-grid-tile [colspan]="sectionColspan(section)">
        <mat-card appearance="outlined" style="width: 100%;">
          <mat-card-title>
            <span translate class="mat-headline-5">{{section.name}}</span>
          </mat-card-title>
          <mat-card-content>
            <mat-grid-list rowHeight="170px" [cols]="sectionPlaces(section).length">
              @for (place of sectionPlaces(section); track place) {
                <mat-grid-tile>
                  <a mat-stroked-button class="tb-card-button" href="{{sectionUrl(place)}}" (click)="navigate($event, place)">
                    <tb-icon matButtonIcon class="tb-mat-96">{{place.icon}}</tb-icon>
                    <span>{{place.customTranslate ? (place.name | customTranslate) : (place.name | translate)}}</span>
                  </a>
                </mat-grid-tile>
              }
            </mat-grid-list>
          </mat-card-content>
        </mat-card>
      </mat-grid-tile>
    }
  </mat-grid-list>
}
