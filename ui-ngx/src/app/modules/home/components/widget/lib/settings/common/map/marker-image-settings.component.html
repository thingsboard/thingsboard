<button type="button"
        mat-stroked-button
        class="tb-box-button"
        [disabled]="disabled"
        #matButton
        (click)="openImageSettingsPopup($event, matButton)">
  @if (modelValue?.type === MarkerImageType.function) {
    <tb-icon matButtonIcon>mdi:function-variant</tb-icon>
  } @else {
    <img width="24px" height="24px" style="object-fit: contain;" [src]="modelValue?.image | image : {preview: true} | async" [class.disabled]="disabled"/>
  }
</button>
