<ng-container [formGroup]="switchControlWidgetSettingsForm">
  <div class="tb-form-panel">
    <div class="tb-form-panel-title" translate>widgets.rpc.common-settings</div>
    <div class="tb-form-row column-xs">
      <div class="fixed-title-width" translate>widgets.rpc.switch-title</div>
      <mat-form-field class="flex" appearance="outline" subscriptSizing="dynamic">
        <input matInput formControlName="title" placeholder="{{ 'widget-config.set' | translate }}">
      </mat-form-field>
    </div>
    <div class="tb-form-row">
      <mat-slide-toggle class="mat-slide" formControlName="showOnOffLabels">
        {{ 'widgets.rpc.show-on-off-labels' | translate }}
      </mat-slide-toggle>
    </div>
  </div>
  <tb-switch-rpc-settings [aliasController]="aliasController"
                          [targetDevice]="targetDevice"
                          formControlName="switchRpcSettings">
  </tb-switch-rpc-settings>
</ng-container>
