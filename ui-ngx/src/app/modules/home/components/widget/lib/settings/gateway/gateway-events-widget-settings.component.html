<section class="tb-widget-settings flex flex-col" [formGroup]="gatewayEventsWidgetSettingsForm">
  <tb-string-pattern-autocomplete class="mat-block flex-1"
                                  brackets="curly"
                                  subscriptSizing="fixed"
                                  predefinedValuesButton="true"
                                  appearance="outline"
                                  label="{{ 'widgets.gateway.events-title' | translate }}"
                                  [predefinedValues]="predefinedValues"
                                  placeholderText="{{ 'widget-config.set' | translate }}"
                                  formControlName="eventsTitle"
  ></tb-string-pattern-autocomplete>
  <mat-form-field class="mat-block flex-1" floatLabel="always" appearance="outline">
    <mat-label translate>widgets.gateway.events-filter</mat-label>
    <mat-chip-grid #chipList formControlName="eventsReg">
      @for (eventFilter of gatewayEventsWidgetSettingsForm.get('eventsReg').value; track eventFilter) {
        <mat-chip-row
          [removable]="true"
          (removed)="removeEventFilter(eventFilter)">
          {{eventFilter}}
          <mat-icon matChipRemove>cancel</mat-icon>
        </mat-chip-row>
      }
      <input
        placeholder="{{ 'widgets.gateway.event-key-contains' | translate }}"
        [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
        [matChipInputFor]="chipList"
        matChipInputAddOnBlur
        (matChipInputTokenEnd)="addEventFilterFromInput($event)">
    </mat-chip-grid>
  </mat-form-field>
</section>
