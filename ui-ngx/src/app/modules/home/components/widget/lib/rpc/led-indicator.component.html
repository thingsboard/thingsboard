<div class="tb-led-indicator flex flex-col">
  <div #ledTitleContainer class="title-container flex max-h-20% flex-full flex-row items-center justify-center" [class.!hidden]="!showTitle">
    <span #ledTitle class="led-title">{{title | customTranslate}}</span>
  </div>
  <div class="flex flex-full flex-col items-center justify-center"
       [class]="{
          'max-h-80%': showTitle,
          'max-h-100%': !showTitle
       }"
       [style.padding-top]="showTitle ? '5px': '10px'" #ledContainer id="led-container">
    <div #led class="led">
    </div>
  </div>
  <div #ledErrorContainer class="error-container flex flex-row items-center justify-center" [style.background]="error?.length ? 'rgba(255,255,255,0.25)' : 'none'">
    <span #ledError class="led-error">{{ error }}</span>
  </div>
  <div #textMeasure id="text-measure"></div>
</div>
