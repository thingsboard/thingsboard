<button type="button"
        mat-stroked-button
        class="tb-box-button"
        [disabled]="disabled"
        #matButton
        (click)="openColorSettingsPopup($event, matButton)">
  <tb-icon matButtonIcon *ngIf="modelValue?.type === DataLayerColorType.function; else colorPreview">mdi:function-variant</tb-icon>
</button>
<ng-template #colorPreview>
  <div class="tb-color-preview box" [class.disabled]="disabled">
    <div class="tb-color-result" [style]="colorStyle"></div>
  </div>
</ng-template>
