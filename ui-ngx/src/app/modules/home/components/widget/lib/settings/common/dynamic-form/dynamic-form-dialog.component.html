<form [formGroup]="dynamicFormGroup" (ngSubmit)="save()" style="min-width: 400px;" class="h-full">
  <mat-toolbar color="tb-primary" class="tb-bottom-border flex flex-row">
    <h2>{{ title }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  <div style="height: 4px;"></div>
  <div mat-dialog-content class="flex-1">
    <tb-dynamic-form
      [properties]="properties"
      formControlName="value">
    </tb-dynamic-form>
  </div>
  <div mat-dialog-actions class="flex flex-row items-center justify-end">
    <span class="flex-1"></span>
    <button mat-button color="primary"
            type="button"
            (click)="cancel()" cdkFocusInitial>
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-button mat-raised-button color="primary"
            type="submit"
            [disabled]="dynamicFormGroup.invalid || !dynamicFormGroup.dirty">
      {{ 'action.save' | translate }}
    </button>
  </div>
</form>
