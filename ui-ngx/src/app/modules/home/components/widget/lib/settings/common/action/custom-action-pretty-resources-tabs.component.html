<mat-tab-group [mat-stretch-tabs]="fullscreen"
               [selectedIndex]="fullscreen ? 2 : 3"
               [disablePagination]="fullscreen"
               class="size-full">
  <mat-tab #resourceTab="matTab">
    <ng-template mat-tab-label>
      <div [matBadge]="action.customResources?.length" [matBadgeHidden]="resourceTab.isActive || !action.customResources?.length"
           matBadgeSize="small">{{ 'widget.resources' | translate }}</div>
    </ng-template>
    <div class="flex flex-col gap-2 pt-4" [class.px-2]="fullscreen">
      @if (action.customResources?.length) {
        @for (resource of action.customResources; track resource; let i = $index) {
          <div class="tb-form-row no-border no-padding">
            <tb-resource-autocomplete class="flex-1"
                                      subscriptSizing="dynamic"
                                      inlineField
                                      hideRequiredMarker required
                                      [allowAutocomplete]="resource.isModule"
                                      [(ngModel)]="resource.url"
                                      (ngModelChange)="notifyActionUpdated()"
                                      placeholder="{{ 'widget.resource-url' | translate }}">
            </tb-resource-autocomplete>
            <mat-checkbox [(ngModel)]="resource.isModule"
                          (ngModelChange)="notifyActionUpdated()">
              {{ 'widget.resource-is-extension' | translate }}
            </mat-checkbox>
            <button mat-icon-button color="primary"
                    [disabled]="isLoading$ | async"
                    type="button"
                    (click)="removeResource(i)"
                    matTooltip="{{'widget.remove-resource' | translate}}"
                    matTooltipPosition="above">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        }
      } @else {
        <span translate
              class="tb-prompt flex items-center justify-center">widget.no-resources</span>
      }
      <div>
        <button mat-raised-button color="primary"
                [disabled]="isLoading$ | async"
                type="button"
                (click)="addResource()"
                matTooltip="{{'widget.add-resource' | translate}}"
                matTooltipPosition="above">
          <span translate>action.add</span>
        </button>
      </div>
    </div>
  </mat-tab>
  <mat-tab label="{{ 'widget.css' | translate }}">
    <tb-css class="flex-1"
            [fillHeight]="true"
            #cssModel="ngModel"
            [(ngModel)]="action.customCss"
            (ngModelChange)="onCodeChange('customCss', cssModel)"
            label="{{ 'widget.css' | translate }}">
    </tb-css>
  </mat-tab>
  <mat-tab label="{{ 'widget.html' | translate }}">
    <tb-html class="flex-1"
             [fillHeight]="true"
             #htmlModel="ngModel"
             [(ngModel)]="action.customHtml"
             (ngModelChange)="onCodeChange('customHtml', htmlModel)"
             label="{{ 'widget.html' | translate }}">
    </tb-html>
  </mat-tab>
  @if (!fullscreen) {
    <mat-tab label="{{ 'widget.js' | translate }}">
      <tb-js-func class="flex-1"
                  [fillHeight]="true"
                  #jsModel="ngModel"
                  [(ngModel)]="action.customFunction"
                  (ngModelChange)="onCodeChange('customFunction', jsModel)"
                  withModules
                  [functionArgs]="['$event', 'widgetContext', 'entityId', 'entityName', 'htmlTemplate', 'additionalParams', 'entityLabel']"
                  [disableUndefinedCheck]="true"
                  [validationArgs]="[]"
                  [editorCompleter]="customPrettyActionEditorCompleter"
                  functionTitle="{{ 'widget-action.custom-pretty-function' | translate }}">
      </tb-js-func>
    </mat-tab>
  }
</mat-tab-group>
