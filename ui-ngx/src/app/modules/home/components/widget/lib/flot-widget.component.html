<div class="tb-absolute-fill flex" [class]="legendContainerLayoutType">
  <tb-legend *ngIf="displayLegend && isLegendFirst"
             [style]="legendStyle"
             [legendConfig]="legendConfig"
             [legendData]="legendData"
             (legendKeyHiddenChange)="onLegendKeyHiddenChange($event)">
  </tb-legend>
  <div class="flex-1" #flotElement></div>
  <tb-legend *ngIf="displayLegend && !isLegendFirst"
             [style]="legendStyle"
             [legendConfig]="legendConfig"
             [legendData]="legendData"
             (legendKeyHiddenChange)="onLegendKeyHiddenChange($event)">
  </tb-legend>
</div>
