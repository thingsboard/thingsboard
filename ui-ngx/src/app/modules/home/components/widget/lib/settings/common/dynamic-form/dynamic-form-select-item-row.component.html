<div [formGroup]="selectItemRowFormGroup" class="tb-form-table-row tb-dynamic-form-select-item-row">
  <tb-value-input class="tb-value-field"
                  shortBooleanField
                  [allowedValueTypes]="[ValueType.STRING, ValueType.INTEGER, ValueType.DOUBLE, ValueType.BOOLEAN]"
                  formControlName="value">
  </tb-value-input>
  <mat-form-field class="tb-inline-field tb-label-field" appearance="outline" subscriptSizing="dynamic">
    <input required matInput formControlName="label" placeholder="{{ 'widget-config.set' | translate }}">
  </mat-form-field>
  <div class="tb-form-table-row-cell-buttons">
    <button *ngIf="!disabled"
            type="button"
            mat-icon-button
            (click)="selectItemRemoved.emit()"
            matTooltip="{{ 'dynamic-form.property.remove-option' | translate }}"
            matTooltipPosition="above">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</div>
