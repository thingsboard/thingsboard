<div class="tb-code-tabs-panel flex flex-col" tb-fullscreen [fullscreen]="fullscreen">
  <div class="tb-code-tabs-toolbar flex flex-row items-center justify-end gap-1">
    <div [tb-help-popup]="helpId"
         tb-help-popup-placement="bottomRight"
         [tb-help-popup-style]="{width: '900px'}">
    </div>
    <button mat-stroked-button
            type="button"
            matTooltip="{{ 'widget.toggle-fullscreen' | translate }}"
            matTooltipPosition="above"
            (click)="toggleFullScreen()">
      <mat-icon>{{ fullscreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
      <span>{{ (fullscreen ? 'fullscreen.exit' : 'fullscreen.fullscreen') | translate }}</span>
    </button>
  </div>
  @if (!fullscreen) {
    <tb-custom-action-pretty-resources-tabs class="h-96"
                                            [action]="action" (actionUpdated)="onActionUpdated($event ? true : false)">
    </tb-custom-action-pretty-resources-tabs>
  } @else {
    <div class="flex min-h-0 flex-1">
      <div #leftPanel class="tb-content flex">
        <tb-custom-action-pretty-resources-tabs class="flex-1"
                                                fullscreen
                                                [action]="action" (actionUpdated)="onActionUpdated($event ? true : false)">
        </tb-custom-action-pretty-resources-tabs>
      </div>
      <div #rightPanel class="tb-content flex">
        <tb-js-func class="flex-1"
                    [fillHeight]="true"
                    [(ngModel)]="action.customFunction"
                    (ngModelChange)="onActionUpdated()"
                    withModules
                    [functionArgs]="['$event', 'widgetContext', 'entityId', 'entityName', 'htmlTemplate', 'additionalParams', 'entityLabel']"
                    [disableUndefinedCheck]="true"
                    [validationArgs]="[]"
                    [editorCompleter]="customPrettyActionEditorCompleter"
                    functionTitle="{{ 'widget-action.custom-pretty-function' | translate }}">
        </tb-js-func>
      </div>
    </div>
  }
</div>
