<ng-container [formGroup]="mapWidgetSettingsForm">
  <tb-map-settings
    [trip]="trip"
    [aliasController]="aliasController"
    [callbacks]="callbacks"
    [functionsOnly]="functionsOnly"
    [widget]="widget"
    formControlName="mapSettings">
  </tb-map-settings>
  <div class="tb-form-panel">
    <div class="tb-form-panel-title" translate>widget-config.card-appearance</div>
    <div class="tb-form-row space-between">
      <div>{{ 'widgets.background.background' | translate }}</div>
      <tb-background-settings formControlName="background">
      </tb-background-settings>
    </div>
    <div class="tb-form-row space-between">
      <div>{{ 'widget-config.card-padding' | translate }}</div>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <input matInput formControlName="padding" placeholder="{{ 'widget-config.set' | translate }}">
      </mat-form-field>
    </div>
  </div>
</ng-container>
