<mat-form-field class="mat-block" [formGroup]="keyFormGroup">
  <mat-label>{{ label | translate }}</mat-label>
  <input [required]="required" matInput
         type="text" placeholder="{{ 'entity.key-name' | translate }}"
         #keyInput
         (focusin)="onFocus()"
         formControlName="key"
         [matAutocomplete]="keyAutocomplete">
  @if (keyFormGroup.get('key').value && !keyFormGroup.get('key').disabled) {
    <button
      type="button"
      matSuffix mat-icon-button aria-label="Clear"
      (click)="clearKey()">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  }
  <mat-autocomplete
    class="tb-autocomplete"
    #keyAutocomplete="matAutocomplete">
    @for (key of filteredKeys | async; track key) {
      <mat-option [value]="key">
        <span [innerHTML]="key | highlight:keySearchText"></span>
      </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
