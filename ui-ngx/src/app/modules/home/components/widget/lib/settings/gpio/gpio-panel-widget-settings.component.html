<section class="tb-widget-settings flex flex-col" [formGroup]="gpioPanelWidgetSettingsForm">
  <fieldset class="fields-group">
    <legend class="group-title" translate>widgets.gpio.panel-settings</legend>
    <tb-color-input
      required
      formControlName="ledPanelBackgroundColor"
      icon="format_color_fill"
      label="{{ 'widgets.gpio.background-color' | translate }}" openOnInput colorClearButton>
    </tb-color-input>
    <fieldset class="fields-group">
      <legend class="group-title" translate>widgets.gpio.gpio-leds</legend>
      <div class="flex flex-col">
        <div class="tb-control-list">
          @for (gpioItemControl of typedSelectOptions; track gpioItemControl; let isLast = $last) {
            <div
              class="flex flex-col" [class.pb-2]="!isLast">
              <tb-gpio-item [formControl]="gpioItemControl"
                            [hasColor]="true"
                            [expanded]="gpioItemControl.new"
                            (removeGpioItem)="removeGpioItem($index)">
              </tb-gpio-item>
            </div>
          }
        </div>
        @if (!gpioListFormArray().controls.length) {
          <div>
            <span translate
            class="tb-prompt flex items-center justify-center">widgets.gpio.no-gpio-leds</span>
          </div>
        }
        <div style="padding-top: 16px;">
          <button mat-raised-button color="primary"
                  type="button"
                  (click)="addGpioItem()">
            <span translate>widgets.gpio.add-gpio-led</span>
          </button>
        </div>
      </div>
    </fieldset>
  </fieldset>
</section>
