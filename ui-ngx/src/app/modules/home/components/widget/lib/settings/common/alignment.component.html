<button type="button"
        mat-stroked-button
        class="tb-box-button"
        matTooltip="{{ alignmentTranslations.get(modelValue) | translate }}"
        matTooltipPosition="above"
        [disabled]="disabled"
        #matButton
        (click)="openAlignmentPopup($event, matButton)">
  <tb-icon matButtonIcon>
    {{ alignmentIcons.get(modelValue) }}
  </tb-icon>
</button>
