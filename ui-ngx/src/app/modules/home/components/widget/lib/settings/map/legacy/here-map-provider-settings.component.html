<section class="tb-widget-settings" [formGroup]="providerSettingsFormGroup">
  <mat-form-field class="mat-block">
    <mat-label translate>widgets.maps.map-layer</mat-label>
    <mat-select required formControlName="mapProviderHere">
      @for (provider of hereMapProviders; track provider) {
        <mat-option [value]="provider">
          {{hereMapProviderTranslations.get(provider) | translate}}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
  <section class="tb-widget-settings" formGroupName="credentials">
    <fieldset class="fields-group">
      <legend class="group-title" translate>widgets.maps.credentials</legend>
      <mat-form-field>
        <mat-label translate>widgets.maps.here-api-key</mat-label>
        <input matInput formControlName="apiKey">
        @if (!providerSettingsFormGroup.get('credentials.apiKey').value) {
          <mat-icon matSuffix
                    class="tb-warning"
                    tabindex="0"
                    role="img"
                    aria-hidden="false"
                    [attr.aria-label]="'widgets.maps.layer.credentials.api-key-missing' | translate"
                    matTooltipPosition="above"
                    matTooltipClass="tb-warning-tooltip"
                    matTooltip="{{ 'widgets.maps.layer.credentials.api-key-missing' | translate }}">
            warning
          </mat-icon>
        }
      </mat-form-field>
    </fieldset>
  </section>
</section>
