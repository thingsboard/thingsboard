<div [formGroup]="widgetSettingsFormGroup" class="h-full">
  <ng-container #definedSettingsContent></ng-container>
  @if (definedDirectiveError) {
    <div class="tb-settings-directive-error">{{definedDirectiveError}}</div>
  }
  @if (useDynamicForm()) {
    <tb-dynamic-form
      [properties]="settingsForm"
      formControlName="settings">
    </tb-dynamic-form>
  }
</div>
