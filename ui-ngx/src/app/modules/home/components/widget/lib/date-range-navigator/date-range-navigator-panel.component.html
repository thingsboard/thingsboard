<div class="mat-content mat-padding flex flex-col">
  @if (settings.showTemplate) {
    <mat-form-field class="mat-block" appearance="outline">
      <input readonly [ngModel]="model.chosenLabel" matInput type="text">
    </mat-form-field>
  }
  <ngx-daterangepicker-material [startDate]="model.startDate"
                                [endDate]="model.endDate"
                                [locale]="locale"
                                [singleDatePicker]="settings.onePanel"
                                [autoApply]="true" (choosedDate)="choosedDate($event)">
  </ngx-daterangepicker-material>
  @if (!settings.autoConfirm) {
    <div class="tb-panel-actions flex flex-row">
      <span class="flex-1"></span>
      <button mat-button mat-raised-button color="primary"
              type="button" (click)="apply()">
        {{ 'action.ok' | translate }}
      </button>
    </div>
  }
</div>
