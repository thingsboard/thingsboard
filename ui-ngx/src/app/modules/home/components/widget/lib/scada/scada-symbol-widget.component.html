<div class="tb-scada-symbol-panel" [style.padding]="padding" [style]="backgroundStyle$ | async">
  <div class="tb-scada-symbol-overlay" [style]="overlayStyle"></div>
  @if (widgetComponent.dashboardWidget.showWidgetTitlePanel) {
    <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  }
  <div class="tb-scada-symbol-content">
    <div #scadaSymbolShape class="tb-scada-symbol-shape">
    </div>
    @if (noScadaSymbol) {
      <div class="tb-no-scada-symbol" translate>scada.no-symbol-selected</div>
    }
  </div>
  @if (loading$ | async) {
    <mat-progress-bar class="tb-action-widget-progress" style="height: 4px;" color="accent" mode="indeterminate"></mat-progress-bar>
  }
</div>
