<form style="width: 600px;">
  <mat-toolbar color="tb-primary" class="tb-bottom-border">
    <span class="flex-1"></span>
    <button mat-icon-button (click)="close()" type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content style="padding: 0">
    <tb-alarm-comment [alarmId]="alarmId"
                      [alarmActivityOnly]="true">
    </tb-alarm-comment>
  </div>
</form>
