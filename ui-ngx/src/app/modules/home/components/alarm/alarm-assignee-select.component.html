<ng-container [formGroup]="assigneeFormGroup">
  <mat-form-field [style]="inline ? {width: '100%'} : {marginBottom: '25px'}"
                  (click)="openAlarmAssigneeSelectPanel($event)"
                  subscriptSizing="dynamic" [appearance]="inline ? 'outline' : 'fill'">
    @if (!inline) {
      <mat-label translate>alarm.assignee</mat-label>
    }
    <input matInput readonly formControlName="assignee">
    @if (assignee) {
      <span matPrefix class="user-avatar" [class.inline-icon]="inline"
            [style.background-color]="getAvatarBgColor()">
        {{ getUserInitials() }}
      </span>
    }
    @if (!assignee) {
      <mat-icon matPrefix class="unassigned-icon" [class.inline-icon]="inline">account_circle</mat-icon>
    }
    @if (!disabled) {
      <mat-icon matSuffix>arrow_drop_down</mat-icon>
    }
  </mat-form-field>
</ng-container>
