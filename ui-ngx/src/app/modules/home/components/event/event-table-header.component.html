<tb-toggle-select [ngModel]="eventTableConfig.eventType"
                  (ngModelChange)="eventTypeChanged($event)">
  @for (type of eventTableConfig.eventTypes; track type) {
    <tb-toggle-option [value]="type">{{ eventTypeTranslationsMap.get(type) | translate }}</tb-toggle-option>
  }
</tb-toggle-select>
