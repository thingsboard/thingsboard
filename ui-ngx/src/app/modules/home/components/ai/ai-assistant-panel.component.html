<div #gripTip class="tb-ai-grip" role="separator" tabindex="0" aria-orientation="vertical"
     [attr.aria-label]="'ai-assistant.resize-panel' | translate"
     [matTooltip]="'ai-assistant.resize-panel-hint' | translate" matTooltipPosition="left" [matTooltipDisabled]="resizing()"
     [attr.aria-valuemin]="minWidth" [attr.aria-valuemax]="splitAvailable() ? splitWidth() : maxWidth" [attr.aria-valuenow]="width()"
     (dblclick)="setWidth(defaultWidth, true)"
     (keydown)="onGripKey($event)"
     (pointerdown)="startResize($event)"></div>
<div class="ai-assistant-container">
  <tb-ai-chat class="ai-assistant-chat"
              variant="panel"
              toastTarget="aiAssistant"
              [fullscreenEnabled]="false"
              [chatId]="chatId()"
              (chatIdChange)="onChatId($event)"
              [clientContext]="clientContext()"
              [prompts]="welcome().examples"
              [startTitle]="welcome().title"
              [startLine]="welcome().line"
              [startPlaceholder]="panelService.config()?.initialPromptPlaceholder"
              [startSuggestion]="welcome().suggestion"
              [split]="split()"
              [splitAvailable]="splitAvailable()"
              (splitToggle)="toggleSplit()"
              (closed)="close()">
  </tb-ai-chat>
</div>
