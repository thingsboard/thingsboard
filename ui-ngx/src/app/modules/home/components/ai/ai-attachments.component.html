<div class="k-files">
  @for (item of shown; track item.resource.id) {
    <button type="button" class="k-file" [class.pic]="item.image" [matTooltip]="item.resource.name" matTooltipPosition="above" (click)="open(item)">
      @if (item.image) {
        <span class="k-file-pic" aria-hidden="true">
          @if (item.url$ | async; as url) {
            <img [src]="url" alt="">
          }
        </span>
      } @else {
        <mat-icon class="tb-mat-18" aria-hidden="true">{{ item.icon }}</mat-icon>
      }
      <span class="k-file-text">
        <b><span class="art-name">{{ fileName(item.resource.name).base }}<span class="art-ext">{{ fileName(item.resource.name).ext }}</span></span></b>
        <small>@if (!item.image && item.extension) { {{ item.extension }} · }{{ factOf(item) ?? (item.resource.size | fileSize) }}</small>
      </span>
    </button>
  }
</div>
