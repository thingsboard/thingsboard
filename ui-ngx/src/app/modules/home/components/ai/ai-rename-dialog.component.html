<mat-toolbar color="tb-primary" class="tb-bottom-border">
  <h2>{{ data.title }}</h2>
  <span class="flex-1"></span>
  <button mat-icon-button
          (click)="cancel()"
          type="button">
    <mat-icon class="material-icons">close</mat-icon>
  </button>
</mat-toolbar>
<div mat-dialog-content>
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="mat-block">
    <input matInput [formControl]="valueControl" cdkFocusInitial/>
  </mat-form-field>
</div>
<div mat-dialog-actions class="tb-dialog-actions justify-end">
  <button mat-button color="primary"
          type="button"
          (click)="cancel()">
    {{ 'action.cancel' | translate }}
  </button>
  <button mat-flat-button color="primary"
          type="button"
          [disabled]="valueControl.invalid"
          (click)="confirm()">
    {{ 'action.rename' | translate }}
  </button>
</div>
