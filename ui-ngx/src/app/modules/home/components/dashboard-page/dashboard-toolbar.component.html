<mat-fab-toolbar color="tb-primary" [isOpen]="toolbarOpened" direction="left"
                 [class.is-fullscreen]="forceFullscreen">
  <mat-fab-trigger>
    <button mat-fab color="tb-primary"
            [matTooltip]="!toolbarOpened ? ('dashboard.open-toolbar' | translate) : ''"
            matTooltipPosition="below"
            (click)="onTriggerClick()">
      <mat-icon>more_horiz</mat-icon>
    </button>
  </mat-fab-trigger>
  <mat-toolbar color="tb-primary">
    <mat-fab-actions class="mat-toolbar-tools">
      <ng-content></ng-content>
    </mat-fab-actions>
  </mat-toolbar>
</mat-fab-toolbar>
