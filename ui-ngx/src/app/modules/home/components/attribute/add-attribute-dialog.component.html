<form [formGroup]="attributeFormGroup" (ngSubmit)="add()" style="min-width: 420px; max-width: 420px;">
  <mat-toolbar class="tb-dialog-header">
    <h2>{{ (isTelemetry ? 'attribute.add-telemetry' : 'attribute.add') | translate }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content>
    <fieldset [disabled]="isLoading$ | async" class="flex flex-col gap-2">
      <tb-string-autocomplete
        panelWidth=""
        additionalClass="mat-block tb-inline-field tb-suffix-absolute tb-suffix-show-on-hover"
        required
        [label]="'attribute.key' | translate"
        subscriptSizing="dynamic"
        appearance="outline"
        [fetchOptionsFn]="isTelemetry && fetchOptions.bind(this)"
        [errorMessages]="attributeErrorMessages"
        [controlValidators]="keyValidators"
        formControlName="key">
      </tb-string-autocomplete>
      <tb-value-input
        formControlName="value"
        [requiredText]="isTelemetry ? 'attribute.telemetry-value-required' : 'attribute.value-required'">
      </tb-value-input>
    </fieldset>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end">
    <button mat-button color="primary"
            type="button"
            [disabled]="(isLoading$ | async)"
            (click)="cancel()" cdkFocusInitial>
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
            type="submit"
            [disabled]="(isLoading$ | async) || invalid() || !attributeFormGroup.dirty">
      {{ 'action.add' | translate }}
    </button>
  </div>
</form>
