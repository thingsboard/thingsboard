<div class="flex flex-col gap-5 p-6">
  <h2 class="tb-iot-hub-delete-title">{{ 'iot-hub.remove-confirm-title' | translate:{ name: data.itemName } }}</h2>
  <p class="tb-iot-hub-delete-desc">{{ description }}</p>
  @if (keptGroups.length) {
    <div class="tb-form-hint tb-primary-fill">
      <mat-icon>info_outline</mat-icon>
      <div class="flex flex-col">
        <div class="font-medium">{{ keptTitle }}</div>
        <div class="tb-iot-hub-kept-groups mt-2 flex flex-col rounded bg-white">
          @for (group of keptGroups; track group.reason; let i = $index; let first = $first) {
            <div role="group" class="flex flex-col gap-1 py-2" [class.tb-iot-hub-kept-group-next]="!first"
                 [attr.aria-labelledby]="'tb-iot-hub-kept-reason-' + i">
              <div class="px-3 pt-1 font-medium leading-4" [id]="'tb-iot-hub-kept-reason-' + i">{{ group.reason }}</div>
              <tb-image-references [references]="group.references"></tb-image-references>
            </div>
          }
        </div>
      </div>
    </div>
  }
</div>
<div class="flex items-center justify-end gap-2 p-2">
  <button mat-button (click)="cancel()">{{ 'action.cancel' | translate }}</button>
  <button mat-flat-button color="warn" (click)="confirm()">{{ 'iot-hub.remove-anyway' | translate }}</button>
</div>
