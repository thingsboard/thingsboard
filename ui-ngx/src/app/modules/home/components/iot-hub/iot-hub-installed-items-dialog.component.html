<div class="flex h-full min-h-0 flex-col">
  <div class="dlg-header flex h-16 shrink-0 items-center gap-2 py-3 pl-6 pr-3">
    <h2 class="dlg-title min-w-0 flex-1 truncate" tbTruncateWithTooltip>
      {{ 'iot-hub.installed-items-for' | translate:{ name: item.name } }}
    </h2>
    <button mat-icon-button
            class="shrink-0"
            type="button"
            (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <tb-iot-hub-installed-items-table [itemVersion]="item">
    </tb-iot-hub-installed-items-table>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end">
    <button mat-button
            type="button"
            (click)="close()">
      {{ 'action.close' | translate }}
    </button>
  </div>
</div>
