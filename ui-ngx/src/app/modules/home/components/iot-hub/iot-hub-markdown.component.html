<!-- Every image the readme itself renders opens in the PhotoSwipe lightbox. The exclusions are the
     chrome that happens to be an <img>: the ${images.gallery(...)} block, which runs its own
     instance of this directive; the clipboard icon on code blocks; and an item link card's
     thumbnail. Images that are the content of a link are excluded for the same reason as that
     thumbnail: the lightbox preventDefaults the click, so opening one would swallow the
     navigation and leave `[![shot](a.png)](https://...)` with no way left to reach its target. -->
<div class="tb-readme-gallery"
     tbPhotoSwipeGallery
     galleryChildrenSelector="img:not(.tb-gallery-images img):not(.clipboard-btn img):not(tb-iot-hub-item-link-card img):not(a img)">
  <tb-markdown [data]="parsedData"
               [applyDefaultMarkdownStyle]="false"
               [additionalStyles]="additionalStyles"
               [additionalCompileModules]="itemLinkCompileModules"
               [lineNumbers]="lineNumbers"
               [fallbackToPlainMarkdown]="fallbackToPlainMarkdown"
               (ready)="onReady()">
  </tb-markdown>
</div>
