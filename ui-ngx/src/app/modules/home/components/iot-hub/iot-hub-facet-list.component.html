<mat-expansion-panel [expanded]="expanded" class="tb-iot-hub-facet-panel">
  <mat-expansion-panel-header>
    <mat-panel-title>{{ label | translate }}</mat-panel-title>
  </mat-expansion-panel-header>

  @if (searchable) {
    <div class="tb-iot-hub-facet-search">
      <mat-icon>search</mat-icon>
      <input [placeholder]="'iot-hub.search' | translate" [ngModel]="search" (ngModelChange)="onSearchChange($event)">
      @if (search) {
        <button mat-icon-button class="tb-iot-hub-facet-search-clear" (click)="onSearchChange('')">
          <mat-icon>close</mat-icon>
        </button>
      }
    </div>
  }

  <div class="tb-iot-hub-facet-items" [class.scrollable]="scrollable">
    @for (key of visibleOptions; track key) {
      <mat-checkbox [checked]="isSelected(key)" (change)="onToggle(key)">
        {{ labelFor(key) }}
      </mat-checkbox>
    }
  </div>
</mat-expansion-panel>
