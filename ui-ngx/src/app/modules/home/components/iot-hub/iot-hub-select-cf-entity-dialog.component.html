<div class="flex flex-col gap-5 p-6">
  <h2 class="tb-iot-hub-install-title">{{ 'iot-hub.install-confirm-title' | translate:{ name: data.itemName } }}</h2>
  <p class="tb-iot-hub-install-desc">{{ 'iot-hub.select-entity-for-cf' | translate:{ name: data.itemName } }}</p>
  <tb-entity-select
    [(ngModel)]="selectedEntityId"
    [allowedEntityTypes]="cfEntityTypes"
    [defaultEntityType]="defaultCfEntityType"
    [filterAllowedEntityTypes]="false"
    appearance="outline"
    required>
  </tb-entity-select>
</div>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ 'action.cancel' | translate }}</button>
  <button mat-flat-button color="primary" [disabled]="!selectedEntityId" (click)="confirm()">
    {{ 'iot-hub.install' | translate }}
  </button>
</mat-dialog-actions>
