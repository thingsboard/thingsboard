<div style="min-width:400px;" class="tb-dialog-content">
  <div class="dlg-header">
    @if (instructions) {<mat-icon>info_outline</mat-icon>}
    <div class="dlg-title">{{ (instructions ? 'iot-hub.solution-instructions' : 'iot-hub.solution-install-title') | translate }}</div>
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="close()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <tb-iot-hub-markdown [data]="details"
                         [lineNumbers]="true"
                         [fallbackToPlainMarkdown]="true"></tb-iot-hub-markdown>
  </div>
  <div mat-dialog-actions class="flex flex-row items-center justify-end">
    <button mat-button
            type="button"
            (click)="close()">
      {{ 'action.close' | translate }}
    </button>
    @if (dashboardId) {
      <button mat-raised-button color="primary"
              (click)="gotoMainDashboard()">
        {{ 'iot-hub.goto-main-dashboard' | translate }}
      </button>
    }
  </div>
</div>
