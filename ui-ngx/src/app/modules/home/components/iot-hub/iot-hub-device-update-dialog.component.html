<div class="tb-iot-hub-pe-required">
  <button mat-icon-button class="tb-iot-hub-pe-required-close" (click)="close()" tabindex="-1">
    <mat-icon>close</mat-icon>
  </button>

  <span class="tb-iot-hub-pe-required-icon" aria-hidden="true"></span>

  <h2 class="tb-iot-hub-pe-required-title">
    {{ 'iot-hub.update-confirm-title' | translate:{ name: data.itemName } }}
  </h2>

  <p class="tb-iot-hub-pe-required-message"
     [innerHTML]="'iot-hub.update-desc-device' | translate"></p>

  <div class="tb-iot-hub-pe-required-actions">
    <button mat-stroked-button color="warn" (click)="reinstall()">
      {{ 'iot-hub.update-anyway' | translate }}
    </button>
    <button mat-flat-button color="primary" (click)="viewUpgradeOptions()">
      {{ 'iot-hub.view-upgrade-options' | translate }}
    </button>
  </div>
</div>
