<form [formGroup]="stateFormGroup" (ngSubmit)="save()">
  <mat-toolbar class="tb-dialog-header">
    <h2 translate>dashboard.select-state</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  }
  <div mat-dialog-content>
    <fieldset [disabled]="isLoading$ | async" class="flex flex-col">
      <mat-form-field class="mat-block">
        <mat-label translate>dashboard.state</mat-label>
        <mat-select required formControlName="stateId">
          @for (stateItem of states | keyvalue; track stateItem) {
            <mat-option [value]="stateItem.key">
              {{ stateItem.value.name }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </fieldset>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end">
    <button mat-button color="primary"
            type="button"
            [disabled]="(isLoading$ | async)"
            (click)="cancel()"
            cdkFocusInitial>
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
            type="submit"
            [disabled]="(isLoading$ | async) || stateFormGroup.invalid">
      {{ 'action.select' | translate }}
    </button>
  </div>
</form>
