<div class="flex flex-col">
  <div class="tb-device-profile-alarms">
    @for (alarmControl of alarmsFormArray.controls; track alarmControl.value.id; let isLast = $last) {
      <div
        class="flex flex-col" [class.pb-2]="!isLast">
        <tb-device-profile-alarm [formControl]="alarmControl"
                                 [expanded]="$index === 0"
                                 [deviceProfileId]="deviceProfileId"
                                 (removeAlarm)="removeAlarm($index)">
        </tb-device-profile-alarm>
      </div>
    }
  </div>
  @if (!alarmsFormArray.controls.length) {
    <div>
      <span translate
      class="tb-prompt flex items-center justify-center">device-profile.no-alarm-rules</span>
    </div>
  }
  @if (!disabled) {
    <div style="padding-top: 16px;">
      <button mat-raised-button color="primary"
              type="button"
              (click)="addAlarm()">
        <span translate>device-profile.add-alarm-rule</span>
      </button>
    </div>
  }
</div>
