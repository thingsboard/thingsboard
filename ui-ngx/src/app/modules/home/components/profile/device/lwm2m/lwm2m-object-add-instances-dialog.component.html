<form [formGroup]="instancesFormGroup" (ngSubmit)="add()" style="min-width: 400px;">
  <mat-toolbar color="tb-primary" class="tb-bottom-border flex flex-row">
    <span style="font-weight: 500">{{data.objectName}}</span>&nbsp;#{{data.objectId}}
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <div mat-dialog-content>
    <fieldset [disabled]="isLoading$ | async">
      <tb-profile-lwm2m-object-add-instances-list
        required
        formControlName="instancesIds">
      </tb-profile-lwm2m-object-add-instances-list>
    </fieldset>
  </div>
  <div mat-dialog-actions class="flex flex-row items-center justify-end">
    <button mat-button color="primary"
            type="button"
            [disabled]="(isLoading$ | async)"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
            type="submit"
            [disabled]="(isLoading$ | async) || instancesFormGroup.invalid || !instancesFormGroup.dirty">
      {{ 'action.save' | translate }}
    </button>
  </div>
</form>
