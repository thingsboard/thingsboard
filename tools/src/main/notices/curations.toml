# Per-package curations: source overrides, declared license fixes, file-scoped false-positive
# ignores, and (only when unavoidable) version-ranged concluded licenses.
#
# Prefer file-scoped `ignore_findings` over whole-package `concluded_license`: ignoring only a
# specific false-positive file keeps the rest of the package actively scanned across upgrades.
# Every `concluded_license` MUST carry a version or range (e.g. [1.0,2.0[) so newer versions
# stop for human review.

[custom_licenses]
"LicenseRef-thingsboard-beerware-googlemutant" = """\
"THE BEER-WARE LICENSE":
ivan@sanchezortega.es wrote this file. As long as you retain this notice you
can do whatever you want with this stuff. If we meet some day, and you think
this stuff is worth it, you can buy me a beer in return."""

