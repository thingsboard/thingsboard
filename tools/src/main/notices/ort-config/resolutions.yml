# Scan issues that do not matter for the notices.
issues:
  - message: "ERROR: Timeout after \\d+ seconds while scanning file '(.*/)?dist/echarts\\.esm\\.mjs\\.map'\\."
    reason: "SCANNER_ISSUE"
    comment: "The source map of echarts, too large to scan in time. It is generated from the sources of the same archive,
      which are scanned, and source maps are left out of every package anyway."
