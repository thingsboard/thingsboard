# Copyright statements that the notices leave out of every package, because they are not about the code of the
# component that carries them. Each is written as the notices print it, and is left out wherever it is found: so only
# a statement belongs here that could not be about the code of any component.
# There are three kinds: a statement about the text of a license, whose own words show that it comes from there; the
# words a map library shows on a map for the owner of the map data; and what is no statement at all, a piece of
# code that the scan took for one.
items:
  # The GNU General Public License 2: "Copyright (C) 1989, 1991 Free Software Foundation, Inc. ... Everyone is
  # permitted to copy and distribute verbatim copies of this license document"
  - "Copyright (c) 1989, 1991 Free Software Foundation, Inc."
  # The GNU Lesser General Public License 2.1, with the same sentence
  - "Copyright (c) 1991, 1999 Free Software Foundation, Inc."
  # The GNU General Public License 3 and the GNU Lesser General Public License 3, with the same sentence
  - "Copyright (c) 2007 Free Software Foundation, Inc. http://fsf.org"
  # No copyright notice: part of a sentence of the GNU licenses about "software which is copyrighted by the Free
  # Software Foundation"
  - "copyrighted by the Free Software Foundation"
  # The GNU Library General Public License 2, with the same sentence as the GNU General Public License 2
  - "Copyright (c) 1991 Free Software Foundation, Inc."
  # The header that the Mozilla Public License 1.1 asks for, where its blanks were not filled in; the file names
  # its initial developer in another line, which the notices have
  - "Portions created by the Initial Developer are Copyright (c) 2010 the Initial Developer"

  # What a map library shows on a map for the provider of the tiles: it says whose the map data is, which the browser
  # of the user fetches from the provider. No library has map data in it.
  # leaflet-providers, in its table of providers
  - "(c) Airbus DS"
  - "(c) Jawg Maps"
  - "(c) MapTiles API"
  - "(c) OpenStreetMap France"
  - "(c) PlanetObserver (Contains Copernicus Data)"
  - "(c) contributors, Singapore Land"
  - "Tiles (c) Esri"
  - "Kaartgegevens (c) Kadaster"
  - "Map (c) 1987"
  - "(c) waymarkedtrails.org"
  - "(c) www.opensnowmap.org"
  - "Map style (c) SafeCast"
  # leaflet-providers and leaflet, and the tests of maplibre-gl
  - "(c) OpenStreetMap contributors"
  - "(c) href https://www.openstreetmap.org/copyright OpenStreetMap contributors"
  # leaflet, in examples
  - "(c) OpenStreetMap"
  - "(c) 2012 IEM Nexrad"
  # maplibre-gl: the link it shows on a map by default
  - "MapLibre (c) MapLibre"

  # No statements: pieces of code, in which (c) is a call or a variable and "copyright" is part of a name
  # webcola
  - "(c) c.right.cIn.push (c) DEBUG"
  # ace-builds
  - "(c) copy' (c) COPY (c)"
  # zrender
  - "(c) k+b,s Co (c)"
  # kotlin-stdlib and kotlin-stdlib-common
  - "copyright Char (c)"
