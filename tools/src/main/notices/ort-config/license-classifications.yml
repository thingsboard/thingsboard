# What the third-party notices owe for each license: see THIRD-PARTY-NOTICES.ftl.
# Every license of a shipped component must be here. The notices are not made for a license that is not: add it,
# after reading what the license asks of someone who distributes the component.
categories:
  - name: "notice"
    description: "The copyright statements and the text of the license."
  - name: "source-link"
    description: "As 'notice', and where the source code of the component is."
  - name: "written-offer"
    description: "As 'notice', and our written offer for the source code: for three years, at the cost of the
      distribution, as the GPL 2 (section 3b) and the LGPL 2.1 (section 6c) ask. A license put here is one that this
      offer satisfies."
  - name: "nothing"
    description: "No obligation, so the notices leave it out: a statement that something is in the public domain."
  - name: "forbidden"
    description: "ThingsBoard cannot ship it, and the notices stop: strong copyleft, which would put ThingsBoard itself
      under that license, and licenses that forbid commercial use. Only removing the component fixes the stop, unless the
      scan misread the license."

