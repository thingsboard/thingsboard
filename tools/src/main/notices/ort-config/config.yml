# The configuration of ORT for the third-party notices: see notices.sh.
# The directories below are in ~/.ort of the host, which is mounted into the ORT container as /ort, so they outlive it.
ort:
  downloader:
    # Scan the published source archive first (sources jar, npm tarball); clone the repository only when there is none.
    sourceCodeOrigins: [ARTIFACT, VCS]

  scanner:
    skipExcluded: true

    # Stored scan results: a second scan of the same source reads them instead of running ScanCode.
    storages:
      local:
        backend:
          localFileStorage:
            directory: /ort/scanner/results
            compression: false
    storageReaders: [local]
    storageWriters: [local]

    provenanceStorage:
      fileStorage:
        localFileStorage:
          directory: /ort/scanner/provenance
          compression: false

    config:
      ScanCode:
        options:
          # Do not change: stored results made with other options are not reused.
          commandLine: '--copyright,--license,--info,--strip-root,--timeout,300'
          # Free to change: does not affect stored results.
          commandLineNonConfig: '--processes,14'
