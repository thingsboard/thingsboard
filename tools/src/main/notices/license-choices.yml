# The license we take where a library offers several: the most permissive one, and among copyleft licenses EPL, CDDL
# or MPL before LGPL or GPL.
# Each rule matches the offered combination, so it applies to every package and version that offers it. A rule for two
# licenses also applies inside a longer combination that contains both.
license_choices:
  repository_license_choices:
    - given: "BSD-3-Clause OR EPL-2.0"
      choice: "BSD-3-Clause"
    - given: "EPL-2.0 OR GPL-2.0-only WITH Classpath-exception-2.0"
      choice: "EPL-2.0"
    - given: "Apache-2.0 OR LGPL-2.1-or-later"
      choice: "Apache-2.0"
    - given: "Apache-2.0 OR MIT"
      choice: "Apache-2.0"
    - given: "EPL-2.0 OR LGPL-2.1-only"
      choice: "EPL-2.0"
    - given: "CDDL-1.0 OR GPL-2.0-only WITH Classpath-exception-2.0"
      choice: "CDDL-1.0"
    - given: "BSD-2-Clause OR CC0-1.0"
      choice: "BSD-2-Clause"
    - given: "EPL-2.0 OR GPL-2.0-only"
      choice: "EPL-2.0"
    - given: "LGPL-2.1-only OR MPL-2.0"
      choice: "MPL-2.0"
    - given: "CDDL-1.1 OR GPL-2.0-only WITH Classpath-exception-2.0"
      choice: "CDDL-1.1"
    - given: "CDDL-1.1 OR GPL-2.0-only"
      choice: "CDDL-1.1"
    - given: "Apache-2.0 OR LGPL-2.0-or-later"
      choice: "Apache-2.0"
    - given: "Apache-2.0 OR LGPL-2.1-only OR MPL-1.1"
      choice: "Apache-2.0"
    - given: "Apache-2.0 OR GPL-2.0-only"
      choice: "Apache-2.0"
    - given: "Apache-2.0 OR MPL-2.0"
      choice: "Apache-2.0"
    - given: "GPL-3.0-or-later OR MIT"
      choice: "MIT"
    - given: "Apache-2.0 OR MPL-1.1"
      choice: "Apache-2.0"
    - given: "BSD-3-Clause OR EPL-1.0"
      choice: "BSD-3-Clause"
    - given: "GPL-3.0-only OR MIT"
      choice: "MIT"
    - given: "GPL-1.0-or-later OR MIT"
      choice: "MIT"
    - given: "MIT OR GPL-2.0-only"
      choice: "MIT"
    - given: "LGPL-2.0-or-later OR MPL-1.1"
      choice: "MPL-1.1"
    - given: "Apache-2.0 OR LGPL-3.0-only"
      choice: "Apache-2.0"
    - given: "Apache-2.0 OR LGPL-3.0-or-later"
      choice: "Apache-2.0"
    - given: "BSD-3-Clause OR LGPL-2.0-or-later"
      choice: "BSD-3-Clause"
