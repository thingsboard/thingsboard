# Global mappings for unambiguous non-SPDX license names declared in Maven POMs.
# Ambiguous names (e.g. unversioned "LGPL") must be mapped per-package in curations.toml.
[license_aliases]
"AL 2.0" = "Apache-2.0"
"Bouncy Castle Licence" = "MIT"
"Eclipse Distribution License - Version 1.0" = "BSD-3-Clause"
"GNU General Public License Version 2" = "GPL-2.0-only"
"GNU General Public License, version 2" = "GPL-2.0-only"
"GNU General Public License, version 2 with the GNU Classpath Exception" = "GPL-2.0-only WITH Classpath-exception-2.0"
"GNU Lesser General Public License (LGPL), Version 2.1" = "LGPL-2.1-only"
"GNU Lesser General Public License Version 2.1" = "LGPL-2.1-only"
"GPL v2" = "GPL-2.0-only"
"GPL v2 with the Classpath exception" = "GPL-2.0-only WITH Classpath-exception-2.0"
"Go License" = "BSD-3-Clause"
"Java HTML Tidy License" = "HTMLTIDY"
"Mozilla Public License Version 2.0" = "MPL-2.0"
"Public Domain" = "LicenseRef-scancode-public-domain"
"SPDX-License-Identifier: MIT" = "MIT"
"The W3C License" = "W3C"

# Readable section titles for licenses without standard SPDX names.
[license_titles]
"LicenseRef-scancode-unicode" = "Unicode License Agreement for Data Files and Software"
"LicenseRef-scancode-unicode-icu-58" = "Unicode License (ICU 58 and later)"
"LicenseRef-scancode-red-hat-attribution" = "Red Hat attribution notice"
"LicenseRef-scancode-paulo-soares" = "Paulo Soares font metrics notice"
"LicenseRef-scancode-w3c-docs-20021231" = "W3C Document License (2002-12-31)"
"LicenseRef-scancode-iso-8879" = "ISO 8879 character entity sets notice"
"LicenseRef-scancode-google-patent-license-webm" = "Google additional patent grant for WebM"
"LicenseRef-scancode-adobe-postscript" = "Adobe PostScript mapping files notice"
"LicenseRef-thingsboard-beerware-googlemutant" = "Beerware (leaflet.gridlayer.googlemutant)"

# License files kept in this repository for non-Maven/non-npm bundled components.
# Keys are the component's exact purl (stops on version drift) or name when it has no purl.
# Note: lwm2m-registry is generated on the fly from application/src/main/data/lwm2m-registry/*.xml.
[license_files]
"pkg:generic/chromium/chromium@156.0.8078.0?os=linux" = "msa/web-report/chromium-credits/CREDITS.txt"
"pkg:generic/chromium/chromium@156.0.8078.0?os=windows" = "msa/web-report/chromium-credits/CREDITS.txt"

