# Global policy for the third-party notices generator.
# Every license of a shipped component must appear in one category below;
# the generator stops on any license, unranked choice, or unmapped license name not listed here.

# Own Maven modules released on independent version cycles (excluded from third-party notices)
own_modules = [
  "org.thingsboard.ai/common",
  "org.thingsboard.license/client",
  "org.thingsboard.license/shared",
]

# Paths of a source archive not part of the shipped library.
# Passed to ScanCode --ignore during scanning AND filtered during resolution.
exclude_paths = [
  "**/test/**",
  "**/tests/**",
  "**/__tests__/**",
  "**/testing/**",
  "**/spec/**",
  "**/specs/**",
  "**/fixtures/**",
  "**/benchmark/**",
  "**/benchmarks/**",
  "**/doc/**",
  "**/docs/**",
  "**/xdocs/**",
  "**/README*",
  "**/CHANGELOG*",
  "**/CHANGES*",
  "**/HISTORY*",
  "**/CONTRIBUTING*",
  "**/pom.xml",
  "**/package.json",
  "**/bower.json",
  "**/composer.lock",
  "**/META-INF/DEPENDENCIES",
  "**/.github/**",
  "**/build/preamble.js",
  "**/Gruntfile*",
  "**/*.map",
  "**/example/**",
  "**/examples/**",
  "**/sample/**",
  "**/samples/**",
  "**/demo/**",
  "**/demos/**",
]

# Preference order when an OR expression offers two licenses in the SAME category.
# Across categories, preference is always: nothing > notice > source-link > written-offer > forbidden.
same_category_preference = [
  "Apache-2.0",
  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "0BSD",
  "CC0-1.0",
  "EPL-2.0",
  "CDDL-1.1",
  "CDDL-1.0",
  "MPL-2.0",
  "MPL-1.1",
  "EPL-1.0",
]

[licenses]
# No obligation, so the notices leave it out (public domain statements).
nothing = [
  "LicenseRef-scancode-public-domain",
  "LicenseRef-scancode-public-domain-disclaimer",
  "CC-PDDC",
]

# Copyright statements and license text (most permissive licenses).
notice = [
  "0BSD",
  "Apache-1.1",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Beerware",
  "BlueOak-1.0.0",
  "BSD-2-Clause",
  "BSD-2-Clause-Views",
  "BSD-3-Clause",
  "BSD-3-Clause-No-Nuclear-Warranty",
  "BSL-1.0",
  "CC-BY-2.5",
  "CC-BY-3.0",
  "CC-BY-4.0",
  "CC0-1.0",
  "DocBook-DTD",
  "DocBook-Stylesheet",
  "HTMLTIDY",
  "ISC",
  "JSON",
  "LicenseRef-scancode-adobe-postscript",
  "LicenseRef-scancode-google-patent-license-webm",
  "LicenseRef-scancode-iso-8879",
  "LicenseRef-scancode-paulo-soares",
  "LicenseRef-scancode-red-hat-attribution",
  "LicenseRef-scancode-unicode",
  "LicenseRef-scancode-unicode-icu-58",
  "LicenseRef-scancode-w3c-docs-20021231",
  "LicenseRef-thingsboard-beerware-googlemutant",
  "MIT",
  "MIT-0",
  "NCSA",
  "NTP",
  "OFL-1.1",
  "Python-2.0",
  "SAX-PD",
  "Unicode-3.0",
  "W3C",
  "W3C-19980720",
  "WTFPL",
  "Zlib",
]

# As 'notice', plus a "Source code:" link.
source-link = [
  "EPL-1.0",
  "EPL-2.0",
  "CDDL-1.0",
  "CDDL-1.1",
  "MPL-1.1",
  "MPL-2.0",
  "APSL-1.0",
  "APSL-2.0",
]

# As 'notice', plus our written offer for source code (3 years, cost of distribution).
written-offer = [
  "LGPL-2.1-or-later",
  "GPL-2.0-only WITH Classpath-exception-2.0",
]

# ThingsBoard cannot ship these: strong copyleft without exception, or non-commercial licenses.
forbidden = [
  "GPL-1.0-only",
  "GPL-1.0-or-later",
  "GPL-2.0-only",
  "GPL-2.0-or-later",
  "GPL-3.0-only",
