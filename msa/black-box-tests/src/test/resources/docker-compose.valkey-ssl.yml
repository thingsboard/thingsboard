services:
# Valkey standalone
# The latest version of Valkey compatible with ThingsBoard is 8.0
  valkey:
    restart: always
    image: bitnamilegacy/valkey:8.0
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'VALKEY_TLS_ENABLED=yes'
      - 'VALKEY_TLS_CERT_FILE=/valkey/certs/valkey.crt'
      - 'VALKEY_TLS_KEY_FILE=/valkey/certs/valkey.key'
      - 'VALKEY_TLS_CA_FILE=/valkey/certs/valkeyCA.crt'
      - 'VALKEY_TLS_AUTH_CLIENTS=no'
    ports:
      - '6379:6379'
    volumes:
      - ./tb-node/valkey-data:/bitnami/valkey/data
      - ./valkey-certs:/valkey/certs

# ThingsBoard setup to use valkey-standalone
  tb-core1:
    env_file:
      - cache-valkey.env
    volumes:
      - ./valkey-certs:/valkey/certs
    depends_on:
      - valkey
  tb-core2:
    env_file:
      - cache-valkey.env
    volumes:
      - ./valkey-certs:/valkey/certs
    depends_on:
      - valkey
  tb-rule-engine1:
    env_file:
      - cache-valkey.env
    volumes:
      - ./valkey-certs:/valkey/certs
    depends_on:
      - valkey
  tb-rule-engine2:
    env_file:
      - cache-valkey.env
    volumes:
      - ./valkey-certs:/valkey/certs
    depends_on:
      - valkey
  tb-mqtt-transport1:
