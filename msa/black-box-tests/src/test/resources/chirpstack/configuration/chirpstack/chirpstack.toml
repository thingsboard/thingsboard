# ChirpStack v4 configuration for black-box integration tests.
# Trimmed from the upstream brocaar/chirpstack-docker example: only the EU868
# region is enabled to speed up startup. Hostnames are injected via the
# environment variables set in docker-compose.chirpstack.yml.

# Logging.
[logging]
  level="info"


# PostgreSQL configuration.
[postgresql]
  dsn="postgres://chirpstack:chirpstack@$POSTGRESQL_HOST/chirpstack?sslmode=disable"
  max_open_connections=10
  min_idle_connections=0


# Redis configuration.
[redis]
  servers=[
    "redis://$REDIS_HOST/",
  ]
  tls_enabled=false
  cluster=false


# Network related configuration.
[network]
  net_id="000000"
  enabled_regions=[
    "eu868",
  ]


# API interface configuration.
[api]
  bind="0.0.0.0:8080"
  secret="black-box-test-secret"


# Application integrations. The MQTT integration is left enabled (as in the
# upstream example) and points at the shared test broker; the per-application
# HTTP integration that forwards uplinks to ThingsBoard is created at runtime
# via the ChirpStack REST API.
[integration]
  enabled=["mqtt"]

  [integration.mqtt]
    server="tcp://$MQTT_BROKER_HOST:1883/"
    json=true
