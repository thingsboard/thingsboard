name: tb-backend-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: tb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thingsboard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-thingsboard}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: tb-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # REST + WebSocket -> this is what your local ui-ngx talks to
      - "${TB_HTTP_PORT:-8080}:8080"
      # MQTT transport
      - "${TB_MQTT_PORT:-1883}:1883"
      # CoAP transport
      - "${TB_COAP_PORT:-5683}:5683/udp"
      # HTTP transport
      - "${TB_TRANSPORT_PORT:-7070}:7070"
      # JVM remote debug (attach from IntelliJ / VS Code)
      - "${TB_DEBUG_PORT:-5005}:5005"
    environment:
      # --- database ---
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-thingsboard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_TS_TYPE: sql
      DATABASE_TS_LATEST_TYPE: sql
      # --- lightweight dev runtime ---
      TB_QUEUE_TYPE: in-memory
      CACHE_TYPE: caffeine
      TB_SERVICE_TYPE: monolith
      HTTP_BIND_ADDRESS: 0.0.0.0
      HTTP_BIND_PORT: 8080
      # --- dev workflow knobs (read by the entrypoint) ---
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-thingsboard}
      TB_LOAD_DEMO: ${TB_LOAD_DEMO:-true}
      TB_FORCE_REINSTALL: ${TB_FORCE_REINSTALL:-false}
      TB_FORCE_BUILD: ${TB_FORCE_BUILD:-false}
      TB_WATCH: ${TB_WATCH:-true}
      TB_WATCH_INTERVAL: ${TB_WATCH_INTERVAL:-2}
      TB_JAVA_OPTS: ${TB_JAVA_OPTS:--Xms512m -Xmx2g -XX:+UseG1GC}
      TB_DEBUG_SUSPEND: ${TB_DEBUG_SUSPEND:-n}
    volumes:
      # your local checkout — edits from your editor land here instantly
      - ${TB_REPO_PATH:-..}:/workspace
      - m2:/root/.m2
    stdin_open: true
    tty: true

volumes:
  pgdata:
  m2:
